<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- GitHub Pages やホーム画面追加時にHTML/JSが古いまま表示されるのを防ぐため、
     このページ自体はキャッシュしないようブラウザに指示する -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>電工二種 暗記カード</title>
<!-- 共有シート・ホーム画面追加・ブラウザタブに表示されるアプリアイコン -->
<link rel="icon" type="image/png" href="icon.png">
<link rel="shortcut icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="電工二種 暗記カード">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220;
  --bg-elevated:#121B2E;
  --bg-elevated-2:#182338;
  --line: rgba(255,255,255,0.08);
  --card:#FBF8F2;
  --card-ink:#1B2430;
  --ink:#E9EDF4;
  --ink-dim:#9AA6B8;
  --accent:#C8722A;
  --accent-soft:rgba(200,114,42,0.18);
  --teal:#4FA6A0;
  --teal-soft:rgba(79,166,160,0.18);
  --danger:#C0453A;
  --danger-soft:rgba(192,69,58,0.18);
  --amber:#D6A93B;
  --blue:#4F7FE0;
  --blue-soft:rgba(79,127,224,0.18);
  --radius:18px;
  --radius-sm:12px;
  --font-display:'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  --font-body:'Noto Sans JP', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{
  font-family:var(--font-body);
  color:var(--ink);
  overscroll-behavior-y:none;
  min-height:100vh;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(200,114,42,0.10), transparent 60%),
    linear-gradient(180deg, #0B1220 0%, #0B1220 100%);
}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
.screen-swipe-root{min-height:100vh;display:flex;flex-direction:column;}
.hairline{height:1px;background:var(--line);border:none;margin:0;}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:rgba(11,18,32,0.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .back{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;
  color:var(--ink);cursor:pointer;flex-shrink:0;
}
.topbar .title{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;flex:1;}
.topbar .title small{display:block;font-family:var(--font-mono);font-weight:400;font-size:10px;color:var(--ink-dim);letter-spacing:.08em;margin-top:1px;}
.topbar .fav-btn{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;
  color:var(--ink-dim);cursor:pointer;flex-shrink:0;
}
.topbar .fav-btn svg{width:19px;height:19px;}
.topbar .fav-btn.active{color:var(--danger);border-color:rgba(192,69,58,0.4);background:rgba(192,69,58,0.12);}

.screen{flex:1;display:flex;flex-direction:column;padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px));gap:10px;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  max-width:520px;margin:0 auto;
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  background:rgba(18,27,46,0.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}
.navbtn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--ink-dim);font-family:var(--font-body);
  font-size:10.5px;padding:6px 10px;border-radius:10px;cursor:pointer;
}
.navbtn.active{color:var(--accent);}
.navbtn svg{width:20px;height:20px;}

/* ---------- Cards / sections ---------- */
.section-label{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--ink-dim);
  text-transform:uppercase;display:flex;align-items:center;gap:8px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--line);}

.panel{
  background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 16px;
}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-tile{
  background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px 14px;position:relative;overflow:hidden;
}
.stat-tile .num{font-family:var(--font-display);font-weight:900;font-size:28px;line-height:1;}
.stat-tile .label{font-size:12px;color:var(--ink-dim);margin-top:6px;}
.stat-tile.due .num{color:var(--danger);}
.stat-tile.new .num{color:var(--ink-dim);}
.stat-tile.learning .num{color:var(--amber);}
.stat-tile.mastered .num{color:var(--teal);}

.gauge-wrap{display:flex;align-items:center;gap:16px;}
.gauge{width:88px;height:88px;flex-shrink:0;}
.gauge-text .big{font-family:var(--font-display);font-weight:900;font-size:22px;}
.gauge-text .small{font-size:12px;color:var(--ink-dim);margin-top:2px;}

.status-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.status-title{font-family:var(--font-display);font-weight:700;font-size:14px;}
.status-progress{font-size:12px;color:var(--ink-dim);}
.status-row{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.status-row:last-child{margin-bottom:0;}
.status-icon{font-size:14px;width:19px;text-align:center;flex-shrink:0;}
.status-label{font-size:12px;width:52px;flex-shrink:0;color:var(--ink);}
.status-track{position:relative;flex:1;height:15px;background:rgba(255,255,255,0.06);border-radius:8px;overflow:hidden;}
.status-fill{position:absolute;left:0;top:0;bottom:0;border-radius:10px;transition:width 0.3s ease;}
.status-fill-perfect{background:var(--blue);}
.status-fill-learned{background:var(--teal);}
.status-fill-unsure{background:var(--amber);}
.status-fill-review{background:var(--danger);}
.status-fill-unlearned{background:rgba(255,255,255,0.14);}
.status-count{
  flex-shrink:0;width:34px;text-align:right;
  font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--ink-dim);
}
.status-count.status-color-perfect{color:var(--blue);}
.status-count.status-color-learned{color:var(--teal);}
.status-count.status-color-unsure{color:var(--amber);}
.status-count.status-color-review{color:var(--danger);}

.cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:18px;border-radius:16px;border:none;cursor:pointer;
  background:linear-gradient(135deg, var(--accent), #A9591B);
  color:#fff;font-family:var(--font-display);font-weight:700;font-size:16px;
  box-shadow:0 10px 24px -8px rgba(200,114,42,0.55);
}
.cta:active{transform:scale(0.98);}
.cta .sub{display:block;font-family:var(--font-mono);font-weight:400;font-size:11px;opacity:.85;margin-top:2px;}

/* ホーム画面の4つの学習選択肢ボタン専用デザイン(.ctaとは独立) */
.cta-home{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;
  width:100%;padding:12px 16px;border-radius:14px;cursor:pointer;text-align:left;
  background:linear-gradient(135deg, #2A3A5C, #22314E);
  border:1px solid rgba(255,255,255,0.14);border-left:3px solid var(--accent);
  color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:15px;
  box-shadow:0 8px 20px -12px rgba(0,0,0,0.55);
}
.cta-home:active{transform:scale(0.98);}
.cta-home.has-alert{border-left-color:var(--danger);box-shadow:0 8px 20px -10px rgba(192,69,58,0.45);}
.cta-home .sub{display:block;font-family:var(--font-mono);font-weight:400;font-size:10.5px;color:var(--ink-dim);opacity:.9;}
.cta-home .cta-caption-inline{display:block;font-family:var(--font-mono);font-weight:600;font-size:10.5px;color:var(--accent);margin-top:1px;}
.cta-home .cta-caption-inline.muted{color:var(--ink-dim);font-weight:400;opacity:.8;}
.alert-badge{
  display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
  background:var(--danger);color:#fff;font-family:var(--font-mono);font-weight:700;font-size:11px;
  padding:4px 10px;border-radius:999px;box-shadow:0 2px 8px -1px rgba(192,69,58,0.6);
  animation:alertPulse 1.6s ease-in-out infinite;
}
.alert-dot{width:6px;height:6px;border-radius:50%;background:#fff;flex-shrink:0;}
@keyframes alertPulse{
  0%,100%{box-shadow:0 2px 8px -1px rgba(192,69,58,0.6);}
  50%{box-shadow:0 2px 14px 2px rgba(192,69,58,0.85);}
}
.cta-caption{text-align:center;font-size:12px;color:var(--ink-dim);margin-top:6px;}

.btn{
  padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg-elevated-2);
  color:var(--ink);font-family:var(--font-body);font-size:14px;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:10px;
}
.btn:active{transform:scale(0.98);}
.btn.primary{background:var(--accent-soft);border-color:rgba(200,114,42,0.4);color:var(--accent);font-weight:700;}
.btn.ghost{background:transparent;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;justify-content:center;}

.mode-list{display:flex;flex-direction:column;gap:8px;}
.mode-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 14px;border-radius:var(--radius-sm);background:var(--bg-elevated);
  border:1px solid var(--line);cursor:pointer;
}
.mode-item:active{transform:scale(0.99);}
.mode-item .arrow{font-family:var(--font-mono);color:var(--accent);font-size:13px;white-space:nowrap;}
.mode-item .name{font-weight:500;font-size:14px;}
.mode-item .count{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);}
.mode-item.forgetting-done{opacity:0.6;}
.mode-item.forgetting-done .count{color:var(--teal);}
.done-check{color:var(--teal);font-size:16px;font-weight:700;}

.cat-item{flex-direction:column;align-items:stretch;gap:8px;}
.cat-item-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cat-stackbar{display:flex;width:100%;height:8px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,0.06);}
.cat-stackbar-seg{height:100%;}
.cat-legend{display:flex;flex-wrap:wrap;gap:6px 12px;}
.cat-legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-dim);}
.cat-legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.cat-legend-count{font-family:var(--font-mono);color:var(--ink);font-weight:700;}

/* 学習履歴: カレンダー */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-nav-btn{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg-elevated-2);color:var(--ink);font-size:17px;cursor:pointer;line-height:1;
}
.cal-nav-btn:active{transform:scale(0.94);}
.cal-nav-label{font-family:var(--font-display);font-weight:700;font-size:14px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:pan-y;}
.cal-weekday{text-align:center;font-size:10px;color:var(--ink-dim);padding-bottom:4px;}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;border-radius:8px;background:rgba(255,255,255,0.03);
}
.cal-cell.empty{background:none;}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
.cal-daynum{font-size:10.5px;color:var(--ink-dim);}
.cal-cell.today .cal-daynum{color:var(--accent);font-weight:700;}
.cal-stamp{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);
  color:var(--danger);border:1.5px solid var(--danger);border-radius:5px;
  font-size:10px;font-weight:900;padding:0 2px;line-height:1.4;opacity:0.92;
  background:rgba(192,69,58,0.08);
}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg-elevated);
  font-size:12.5px;color:var(--ink-dim);cursor:pointer;font-family:var(--font-body);
}
.chip.active{background:var(--accent-soft);border-color:rgba(200,114,42,0.5);color:var(--accent);font-weight:700;}

.search-input, .text-input, textarea.text-input{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg-elevated-2);color:var(--ink);font-family:var(--font-body);font-size:14px;
}
textarea.text-input{resize:vertical;font-family:var(--font-mono);font-size:12px;min-height:120px;}
.search-input::placeholder,.text-input::placeholder{color:var(--ink-dim);}

.card-list-item{
  display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--radius-sm);
  background:var(--bg-elevated);border:1px solid var(--line);cursor:pointer;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;
}
.card-list-item.dragging{
  opacity:0.92;box-shadow:0 10px 26px -6px rgba(0,0,0,0.55);z-index:5;position:relative;
  background:var(--bg-elevated-2);border-color:var(--accent);transition:none;
}
.cli-draghandle{
  flex-shrink:0;width:30px;align-self:stretch;display:flex;align-items:center;justify-content:center;
  color:var(--ink-dim);font-size:19px;letter-spacing:-1px;line-height:1;
  touch-action:none;cursor:grab;margin:-10px 0;padding:10px 0;
}
.cli-draghandle.disabled{opacity:0.25;cursor:default;}
.thumb{
  width:52px;height:52px;border-radius:10px;background:var(--bg-elevated-2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);
}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb.symbol img{object-fit:contain;padding:6px;background:#fff;}
.cli-body{flex:1;min-width:0;}
.cli-name{font-weight:700;font-size:14px;}
.cli-meta{font-size:11px;color:var(--ink-dim);font-family:var(--font-mono);margin-top:2px;}
.badge{
  font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:6px;letter-spacing:.03em;
}
.badge.new{background:rgba(154,166,184,0.15);color:var(--ink-dim);}
.badge.learning{background:var(--amber);color:#2a2000;background:rgba(214,169,59,0.2);color:var(--amber);}
.badge.mastered{background:var(--teal-soft);color:var(--teal);}
.badge.due{background:var(--danger-soft);color:var(--danger);}
.badge.tier-unlearned{background:#5B6478;color:#fff;}
.badge.tier-review{background:var(--danger);color:#fff;}
.badge.tier-unsure{background:var(--amber);color:#fff;}
.badge.tier-learned{background:var(--teal);color:#fff;}
.badge.tier-perfect{background:var(--blue);color:#fff;}

/* ---------- Study screen ---------- */
.study-progress{display:flex;align-items:center;gap:10px;}
.progress-track{flex:1;height:5px;border-radius:99px;background:var(--bg-elevated-2);overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease;}
.study-count{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);white-space:nowrap;}

.card-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:420px;padding:6px 0;}
.flashcard{
  width:100%;max-width:380px;min-height:420px;border-radius:22px;background:var(--card);color:var(--card-ink);
  box-shadow:0 20px 50px -18px rgba(0,0,0,0.6);position:relative;overflow:hidden;
  display:flex;flex-direction:column;cursor:pointer;user-select:none;touch-action:pan-y;
  border:1px solid rgba(0,0,0,0.06);
}
.flashcard::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(27,36,48,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(27,36,48,0.04) 1px, transparent 1px);
  background-size:18px 18px;
}
.fc-tick{position:absolute;width:10px;height:10px;border:2px solid rgba(27,36,48,0.18);}
.fc-tick.tl{top:10px;left:10px;border-right:none;border-bottom:none;}
.fc-tick.tr{top:10px;right:10px;border-left:none;border-bottom:none;}
.fc-tick.bl{bottom:10px;left:10px;border-right:none;border-top:none;}
.fc-tick.br{bottom:10px;right:10px;border-left:none;border-top:none;}

.fc-eyebrow{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;color:#8a7a5c;
  padding:20px 22px 0;text-transform:uppercase;position:relative;z-index:1;
}
.fc-question{
  font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.5;
  padding:8px 22px 0;position:relative;z-index:1;
}
.fc-media{
  flex:1;display:flex;align-items:center;justify-content:center;padding:16px 26px;position:relative;z-index:1;min-height:150px;
}
.fc-media img{max-width:100%;max-height:220px;object-fit:contain;}
.fc-media.symbol img{background:#fff;border-radius:10px;padding:14px;border:1px solid rgba(0,0,0,0.08);}
.fc-media .desc-text{font-size:17px;line-height:1.7;font-weight:500;text-align:center;}
.fc-hint{
  text-align:center;font-family:var(--font-mono);font-size:10.5px;color:#a8987a;padding:0 20px 18px;
  letter-spacing:.05em;position:relative;z-index:1;
}
.fc-divider{height:1px;background:rgba(27,36,48,0.1);margin:0 22px;position:relative;z-index:1;}
.fc-answer{padding:16px 22px 22px;position:relative;z-index:1;}
.fc-answer .a-label{font-family:var(--font-mono);font-size:10px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;}
.fc-answer .a-name{font-family:var(--font-display);font-weight:900;font-size:22px;margin-top:4px;}
.fc-answer .a-media{margin-top:10px;display:flex;justify-content:center;}
.fc-answer .a-media img{max-height:120px;max-width:100%;object-fit:contain;}
.fc-answer .a-media.symbol img{background:#fff;border-radius:10px;padding:10px;border:1px solid rgba(0,0,0,0.08);max-height:100px;}
.fc-answer .a-sublabel{font-family:var(--font-mono);font-size:10px;color:#a8987a;letter-spacing:.08em;text-transform:uppercase;margin-top:12px;}
.fc-answer .a-desc{font-size:13.5px;color:#5a6270;margin-top:8px;line-height:1.6;}

.swipe-flash{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:900;font-size:34px;border-radius:22px;
  opacity:0;pointer-events:none;letter-spacing:.05em;
}
.swipe-flash.correct{background:rgba(79,166,160,0.88);color:#fff;}
.swipe-flash.incorrect{background:rgba(192,69,58,0.88);color:#fff;}

.judge-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 6px;}
.judge-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:16px;
  border:1px solid var(--line);background:var(--bg-elevated);cursor:pointer;font-family:var(--font-body);
}
.judge-btn:active{transform:scale(0.96);}
.judge-btn.incorrect{color:var(--danger);}
.judge-btn.correct{color:var(--teal);}
.judge-btn .arrow-ico{font-size:18px;}
.judge-btn .txt{font-size:12px;font-weight:700;}
.judge-hint{opacity:.5;}

/* ---------- Result screen ---------- */
.result-hero{text-align:center;padding:20px 0 6px;}

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// cards_data.js はブラウザ/ホーム画面キャッシュの影響を受けやすいため、
// 読み込みのたびにキャッシュを回避するクエリパラメータを付与して取得する
document.write('<scr' + 'ipt src="cards_data.js?v=' + Date.now() + '"></scr' + 'ipt>');
</script>
<script>
/* =========================================================================
   電工二種 暗記カードアプリ — 単一ファイル実装
   構成:
   1. Storage layer (window.storage 抽象化 + フォールバック)
   2. データモデル / カード・学習履歴・画像 の分離管理
   3. 画像処理 (リサイズ + WebP変換)
   4. CSV パーサ & インポート
   5. 復習アルゴリズム (忘却曲線モジュール, UIから独立)
   6. ルータ & 画面描画
   ========================================================================= */

/* ---------------------------------------------------------------------
   1. STORAGE LAYER
   window.storage が使えない環境でも動くよう、メモリフォールバックを用意。
   キー設計:
     "cards"            -> カードマスターデータ配列 (JSON)
     "learning"         -> 学習履歴 (cardId をキーにしたオブジェクト, JSON)
     "settings"         -> アプリ設定 (JSON)
     "img:<cardId>:photo"  -> 写真画像 (webp dataURL, テキスト)
     "img:<cardId>:symbol" -> 配線図記号画像 (webp dataURL, テキスト)
   カードデータと学習履歴・画像を別キーに分離することで、
   カードデータを更新しても学習履歴が破壊されないようにしている。
--------------------------------------------------------------------- */
/* ---------------------------------------------------------------------
   1. STORAGE LAYER
   window.storage(Claude環境専用)が使えない場合は、GitHub Pages等の実運用で
   確実にデータが残るよう IndexedDB を使う。IndexedDBも使えない場合のみ、
   最後の手段としてメモリ上の一時保存(ページを閉じると消える)にフォールバックする。
   キー設計:
     "cards"            -> カードマスターデータ配列 (JSON)
     "learning"         -> 学習履歴 (cardId をキーにしたオブジェクト, JSON)
     "settings"         -> アプリ設定 (JSON)
     "img:<cardId>:photo"  -> 写真画像 (webp dataURL, テキスト)
     "img:<cardId>:symbol" -> 配線図記号画像 (webp dataURL, テキスト)
   カードデータと学習履歴・画像を別キーに分離することで、
   カードデータを更新しても学習履歴が破壊されないようにしている。
--------------------------------------------------------------------- */
const MemoryFallback = (() => {
  const mem = {};
  return {
    async get(key){ return (key in mem) ? {key, value: mem[key], shared:false} : null; },
    async set(key, value){ mem[key] = value; return {key, value, shared:false}; },
    async delete(key){ const existed = key in mem; delete mem[key]; return {key, deleted:existed, shared:false}; },
    async list(prefix){ const keys = Object.keys(mem).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix, shared:false}; }
  };
})();
// ブラウザの IndexedDB を使った永続ストレージ実装(window.storage と同じインターフェース)
const IndexedDBStore = (() => {
  const DB_NAME = 'electrician_flashcards_db';
  const STORE_NAME = 'kv';
  let dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, {keyPath:'key'});
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return dbPromise;
  }
  return {
    async get(key){
      const db = await openDB();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(key);
        req.onsuccess = ()=> resolve(req.result ? {key, value:req.result.value, shared:false} : null);
        req.onerror = ()=> reject(req.error);
      });
    },
    async set(key, value){
      const db = await openDB();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put({key, value});
        tx.oncomplete = ()=> resolve({key, value, shared:false});
        tx.onerror = ()=> reject(tx.error);
      });
    },
    async delete(key){
      const db = await openDB();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(key);
        tx.oncomplete = ()=> resolve({key, deleted:true, shared:false});
        tx.onerror = ()=> reject(tx.error);
      });
    },
    async list(prefix){
      const db = await openDB();
      return new Promise((resolve, reject)=>{
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAllKeys();
        req.onsuccess = ()=>{
          const keys = req.result.filter(k => !prefix || k.startsWith(prefix));
          resolve({keys, prefix, shared:false});
        };
        req.onerror = ()=> reject(req.error);
      });
    }
  };
})();
const store = (window.storage && window.storage.get)
  ? window.storage
  : (window.indexedDB ? IndexedDBStore : MemoryFallback);

async function storeGetJSON(key, fallback){
  try{
    const res = await store.get(key, false);
    if(!res || res.value === undefined) return fallback;
    return JSON.parse(res.value);
  }catch(e){ return fallback; }
}
async function storeSetJSON(key, obj){
  try{ await store.set(key, JSON.stringify(obj), false); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function storeGetText(key){
  try{
    const res = await store.get(key, false);
    return res ? res.value : null;
  }catch(e){ return null; }
}
async function storeSetText(key, text){
  try{ await store.set(key, text, false); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function storeDelete(key){
  try{ await store.delete(key, false); }catch(e){}
}

/* ---------------------------------------------------------------------
   2. IN-MEMORY STATE (loaded from storage at boot)
--------------------------------------------------------------------- */
const DEFAULT_SETTINGS = {
  questionCount: 'all',       // 1回の出題数デフォルト('all'=すべて出題)
  randomOrder: true,          // ランダム性を出題順に反映
  enabledModes: {             // 出題方向ごとの有効/無効(将来拡張しやすい構造)
    symbol2name:false, photo2name:true, desc2name:false, name2desc:false
  },
  forgettingCompletions: {}   // { [経過日数]: 'YYYY-MM-DD' } その日数の復習を完了した日付(忘却曲線対応復習)
};

let CARDS = [];        // カードマスターデータ
let LEARNING = {};      // { [cardId]: LearningRecord }
let SETTINGS = {...DEFAULT_SETTINGS};
let STUDY_DAYS = {};    // { 'YYYY-MM-DD': true } 学習(判定)を1回でも行った日の記録(履歴カレンダー用)
let IMAGE_CACHE = {};   // { "cardId:photo": dataUrl } メモリキャッシュ(遅延読み込み用)

// 出題方向の定義。将来の拡張(写真⇄記号 等)もこの配列に足すだけで対応できる。
const QUESTION_MODES = [
  { id:'symbol2name', label:'配線図記号 → 名称', qSide:'symbol', aSide:'name', qLabel:'この配線図記号の名称は?' },
  { id:'photo2name',  label:'写真 → 名称',       qSide:'photo',  aSide:'name', qLabel:'この器具の名称は?' },
  { id:'desc2name',   label:'役割 → 名称',       qSide:'desc',   aSide:'name', qLabel:'次の役割を持つ器具は?' },
  { id:'name2desc',   label:'名称 → 役割',       qSide:'name',   aSide:'desc', qLabel:'この役割は?' },
];
function modeById(id){ return QUESTION_MODES.find(m=>m.id===id); }

function newLearningRecord(){
  return {
    status:'new',            // new | learning | mastered (旧仕様の名残。互換性のため保持)
    reviewCount:0, correctCount:0, incorrectCount:0,
    correctStreak:0, incorrectStreak:0,
    lastReviewedAt:null, nextReviewAt:null, interval:0,
    perfectSince:null,        // 「完璧」ティアに初めて到達した日時(忘却曲線対応復習で使用)
    modeStats:{}              // { modeId: {reviewCount,correct,incorrect} } 方向別正解率(42章)
  };
}
function getLearning(cardId){
  if(!LEARNING[cardId]) LEARNING[cardId] = newLearningRecord();
  return LEARNING[cardId];
}

/* ---------------------------------------------------------------------
   学習状況の5段階ティア分類(未学習/要復習/不安あり/覚えた/完璧)
   - 未学習: 一度も回答していない
   - 要復習: 直近の回答が不正解(連続不正解が1以上)
   - 不安あり: 連続正解1回
   - 覚えた: 連続正解2回
   - 完璧: 連続正解3回以上
--------------------------------------------------------------------- */
const TIER_ORDER = ['unlearned','review','unsure','learned','perfect'];
const TIER_LABELS = {unlearned:'未学習', review:'要復習', unsure:'不安あり', learned:'覚えた', perfect:'完璧'};
const TIER_ICONS = {unlearned:'😐', review:'😖', unsure:'😟', learned:'🙂', perfect:'😆'};
function classifyTier(rec){
  if(!rec || rec.reviewCount === 0) return 'unlearned';
  if(rec.incorrectStreak >= 1) return 'review';
  if(rec.correctStreak >= 3) return 'perfect';
  if(rec.correctStreak === 2) return 'learned';
  if(rec.correctStreak === 1) return 'unsure';
  return 'review';
}

/* ---------------------------------------------------------------------
   忘却曲線対応復習: 「完璧」ティアに到達してから経過した日数でカードを抽出
--------------------------------------------------------------------- */
const FORGETTING_DAYS = [1,3,7,14,30];
function daysSincePerfect(rec){
  if(!rec || !rec.perfectSince) return null;
  const diffMs = Date.now() - new Date(rec.perfectSince).getTime();
  return Math.floor(diffMs / (1000*60*60*24));
}
function forgettingCardsForDays(days){
  return CARDS.filter(c=>{
    const rec = LEARNING[c.id];
    if(classifyTier(rec) !== 'perfect') return false;
    const d = daysSincePerfect(rec);
    return d !== null && d >= days;
  });
}
function todayDateStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isForgettingCompletedToday(days){
  const map = SETTINGS.forgettingCompletions;
  return !!(map && map[days] === todayDateStr());
}
function markForgettingCompletedToday(days){
  if(!SETTINGS.forgettingCompletions) SETTINGS.forgettingCompletions = {};
  SETTINGS.forgettingCompletions[days] = todayDateStr();
}
function forgettingHasAny(){
  // 対象カードがあり、かつ今日まだその日数の復習を完了していないものが1つでもあればアラート対象
  return FORGETTING_DAYS.some(d => forgettingCardsForDays(d).length > 0 && !isForgettingCompletedToday(d));
}

async function loadAll(){
  const existing = await store.get('cards', false).catch(()=>null);
  if(!existing || existing.value === undefined){
    // 初回起動: プリインストールされたデフォルトカードセットを読み込む(cards_data.js)
    await installDefaultDeckIfAvailable();
  }
  CARDS = await storeGetJSON('cards', []);
  LEARNING = await storeGetJSON('learning', {});
  SETTINGS = Object.assign({...DEFAULT_SETTINGS}, await storeGetJSON('settings', {}));
  STUDY_DAYS = await storeGetJSON('study_days', {});
  // 既存カードが持つカテゴリを選択肢に反映(前回セッションで追加したカテゴリも復元される)
  CARDS.forEach(c=>{ if(c.category && !CATEGORY_LIST.includes(c.category)) CATEGORY_LIST.push(c.category); });
  // 2回目以降の起動: cards_data.js が更新されていれば、ユーザーが編集していない
  // プリインストールカードだけを最新内容に同期する(学習履歴・ユーザーの編集は保持したまま)
  await syncDefaultDeck();
}
async function installDefaultDeckIfAvailable(){
  if(typeof window.DEFAULT_CARDS === 'undefined') { await storeSetJSON('cards', []); return; }
  try{
    CARDS = JSON.parse(JSON.stringify(window.DEFAULT_CARDS));
    await saveCards();
    const images = window.DEFAULT_IMAGES || {};
    const keys = Object.keys(images);
    for(let i=0;i<keys.length;i++){
      await storeSetText(keys[i], images[keys[i]]);
    }
    await storeSetJSON('default_deck_version', window.DEFAULT_DECK_VERSION || 0);
  }catch(e){
    console.error('デフォルトカードの初期化に失敗しました', e);
    await storeSetJSON('cards', []);
  }
}
async function syncDefaultDeck(){
  if(typeof window.DEFAULT_CARDS === 'undefined') return;
  const newVersion = window.DEFAULT_DECK_VERSION || 0;
  const currentVersion = await storeGetJSON('default_deck_version', 0);
  if(currentVersion >= newVersion) return; // 更新なし
  try{
    const images = window.DEFAULT_IMAGES || {};
    const byId = {};
    CARDS.forEach(c=>{ byId[c.id] = c; });
    let addedCount = 0, updatedCount = 0;
    for(const defCard of window.DEFAULT_CARDS){
      const existingCard = byId[defCard.id];
      if(!existingCard){
        // GitHub側で新しく追加されたプリインストールカード
        const clone = JSON.parse(JSON.stringify(defCard));
        CARDS.push(clone);
        byId[clone.id] = clone;
        if(clone.photoImage && images[`img:${clone.id}:photo`]) await storeSetText(`img:${clone.id}:photo`, images[`img:${clone.id}:photo`]);
        if(clone.symbolImage && images[`img:${clone.id}:symbol`]) await storeSetText(`img:${clone.id}:symbol`, images[`img:${clone.id}:symbol`]);
        addedCount++;
        continue;
      }
      // ユーザーが名称・役割・画像を編集済み(updatedAt が createdAt と異なる)カードは上書きしない
      const untouched = existingCard.updatedAt === existingCard.createdAt;
      if(!untouched) continue;
      existingCard.name = defCard.name;
      existingCard.category = defCard.category;
      existingCard.tags = defCard.tags;
      existingCard.difficulty = defCard.difficulty;
      existingCard.description = defCard.description;
      existingCard.photoImage = defCard.photoImage;
      existingCard.symbolImage = defCard.symbolImage;
      existingCard.updatedAt = defCard.updatedAt;
      if(defCard.photoImage && images[`img:${defCard.id}:photo`]){
        await storeSetText(`img:${defCard.id}:photo`, images[`img:${defCard.id}:photo`]);
        IMAGE_CACHE[`${defCard.id}:photo`] = images[`img:${defCard.id}:photo`];
      } else if(!defCard.photoImage){
        await storeDelete(`img:${defCard.id}:photo`);
        delete IMAGE_CACHE[`${defCard.id}:photo`];
      }
      if(defCard.symbolImage && images[`img:${defCard.id}:symbol`]){
        await storeSetText(`img:${defCard.id}:symbol`, images[`img:${defCard.id}:symbol`]);
        IMAGE_CACHE[`${defCard.id}:symbol`] = images[`img:${defCard.id}:symbol`];
      } else if(!defCard.symbolImage){
        await storeDelete(`img:${defCard.id}:symbol`);
        delete IMAGE_CACHE[`${defCard.id}:symbol`];
      }
      updatedCount++;
    }
    await saveCards();
    await storeSetJSON('default_deck_version', newVersion);
    if(addedCount || updatedCount){
      console.log(`プリインストールカードを更新しました(追加:${addedCount}件 / 更新:${updatedCount}件)`);
    }
  }catch(e){
    console.error('デフォルトカードの同期に失敗しました', e);
  }
}
async function saveCards(){ await storeSetJSON('cards', CARDS); }
async function saveLearning(){ await storeSetJSON('learning', LEARNING); }
async function saveSettings(){ await storeSetJSON('settings', SETTINGS); }
async function saveStudyDays(){ await storeSetJSON('study_days', STUDY_DAYS); }

async function getImage(cardId, kind){ // kind: 'photo' | 'symbol'
  const cacheKey = cardId+':'+kind;
  if(IMAGE_CACHE[cacheKey] !== undefined) return IMAGE_CACHE[cacheKey];
  const val = await storeGetText('img:'+cardId+':'+kind);
  IMAGE_CACHE[cacheKey] = val;
  return val;
}
async function setImage(cardId, kind, dataUrl){
  IMAGE_CACHE[cardId+':'+kind] = dataUrl;
  await storeSetText('img:'+cardId+':'+kind, dataUrl);
}

/* ---------------------------------------------------------------------
   3. 画像処理: リサイズ + WebP変換
   元画像をそのまま保存しない。写真は長辺1000px、記号は長辺700px を目安に縮小。
--------------------------------------------------------------------- */
function fileToImage(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
async function processImageFile(file, kind){
  const maxDim = kind === 'symbol' ? 700 : 1000;
  const img = await fileToImage(file);
  let {width, height} = img;
  if(width > height){ if(width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; } }
  else { if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; } }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, width, height);
  // WebP変換を試み、非対応環境ではPNG/JPEGにフォールバック
  let dataUrl = canvas.toDataURL('image/webp', 0.82);
  if(!dataUrl.startsWith('data:image/webp')){
    dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  }
  return dataUrl;
}

/* ---------------------------------------------------------------------
   4. CSV パーサ & インポート
   期待するヘッダ例:
   id,name,category,tags,difficulty,description,symbolImageFile,photoImageFile
   (id は空でも自動採番。tags は "|" 区切り)
--------------------------------------------------------------------- */
function parseCSV(text){
  // シンプルだが引用符(",")対応のCSVパーサ
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field='';
        if(row.length > 1 || row[0] !== ''){ rows.push(row); }
        row = [];
      } else field += c;
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>c.trim()!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=> obj[h] = (r[idx] !== undefined ? r[idx].trim() : ''));
    return obj;
  });
}

const CATEGORY_LIST = ['コンセント','スイッチ','配線用遮断器など','照明器具','電線菅','ボックス','計測器','電線・ケーブルの工具','金属管工具','合成樹脂菅工具','木材工具','その他工具','電線・ケーブル','配線図記号','その他'];

function slugId(name, idx){
  const base = 'card_' + (name||'').replace(/[^\p{L}\p{N}]/gu,'').slice(0,12);
  return base ? base + '_' + idx : 'card_' + idx;
}

async function importCSVText(text, logFn){
  const rows = parseCSV(text);
  if(!rows.length){ logFn('CSVにデータ行が見つかりませんでした。', 'err'); return {imported:0, pendingImages:[]}; }
  let imported = 0, updated = 0;
  const pendingImages = []; // { cardId, kind, filename }
  const existingIds = new Set(CARDS.map(c=>c.id));
  rows.forEach((r, idx)=>{
    if(!r.name){ logFn(`行${idx+2}: name が空のためスキップしました。`, 'warn'); return; }
    let id = r.id && r.id.trim() ? r.id.trim() : slugId(r.name, idx+1);
    let cat = r.category && r.category.trim() ? r.category.trim() : 'その他';
    if(!CATEGORY_LIST.includes(cat)) CATEGORY_LIST.push(cat);
    const tags = r.tags ? r.tags.split('|').map(t=>t.trim()).filter(Boolean) : [];
    const now = new Date().toISOString();
    const existing = CARDS.find(c=>c.id===id);
    const cardData = {
      id, name:r.name.trim(), category:cat, tags,
      difficulty: r.difficulty ? Number(r.difficulty)||2 : 2,
      description: r.description ? r.description.trim() : '',
      symbolImage: existing ? existing.symbolImage : null,
      photoImage: existing ? existing.photoImage : null,
      favorite: existing ? existing.favorite : false,
      createdAt: existing ? existing.createdAt : now,
      updatedAt: now,
    };
    if(existing){
      Object.assign(existing, cardData);
      updated++;
    } else {
      CARDS.push(cardData);
      imported++;
    }
    if(r.symbolImageFile && r.symbolImageFile.trim()) pendingImages.push({cardId:id, kind:'symbol', filename:r.symbolImageFile.trim()});
    if(r.photoImageFile && r.photoImageFile.trim()) pendingImages.push({cardId:id, kind:'photo', filename:r.photoImageFile.trim()});
  });
  await saveCards();
  logFn(`インポート完了: 新規 ${imported}件 / 更新 ${updated}件`, 'ok');
  if(pendingImages.length){
    logFn(`画像ファイル参照 ${pendingImages.length}件を検出しました。下の画像アップロードで一括登録できます。`, 'warn');
  }
  return {imported, updated, pendingImages};
}

/* ---------------------------------------------------------------------
   5. 復習アルゴリズム(忘却曲線モジュール) — UI/データから独立させ、
      将来より高度なアルゴリズムに差し替えやすい構造にする。
--------------------------------------------------------------------- */
const ReviewScheduler = (() => {
  const CORRECT_INTERVALS = [1,3,7,14,30,60,120]; // streak 1..7+ (7以降は120固定、以後+60ずつ延長)
  const INCORRECT_INTERVALS = [1,1,3,7];
  function daysFromNow(days){
    const d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString();
  }
  function intervalForCorrectStreak(streak){
    if(streak <= CORRECT_INTERVALS.length) return CORRECT_INTERVALS[streak-1];
    // 6回目以降は120日、さらに以後60日ずつ延長
    const extra = streak - CORRECT_INTERVALS.length;
    return CORRECT_INTERVALS[CORRECT_INTERVALS.length-1] + extra*60;
  }
  function intervalForIncorrectStreak(streak){
    const idx = Math.min(streak-1, INCORRECT_INTERVALS.length-1);
    return INCORRECT_INTERVALS[idx];
  }
  function applyResult(rec, isCorrect, modeId){
    rec.reviewCount++;
    rec.lastReviewedAt = new Date().toISOString();
    if(!rec.modeStats[modeId]) rec.modeStats[modeId] = {reviewCount:0, correct:0, incorrect:0};
    rec.modeStats[modeId].reviewCount++;
    if(isCorrect){
      rec.correctCount++;
      rec.correctStreak++;
      rec.incorrectStreak = 0;
      rec.modeStats[modeId].correct++;
      rec.interval = intervalForCorrectStreak(rec.correctStreak);
      rec.status = rec.correctStreak >= 5 ? 'mastered' : 'learning';
      if(rec.correctStreak === 3 && !rec.perfectSince){
        rec.perfectSince = new Date().toISOString(); // 「完璧」ティアに到達した日時(忘却曲線対応復習で使用)
      }
    } else {
      rec.incorrectCount++;
      rec.incorrectStreak++;
      rec.correctStreak = 0;
      rec.modeStats[modeId].incorrect++;
      rec.interval = intervalForIncorrectStreak(rec.incorrectStreak);
      rec.status = 'learning';
      rec.perfectSince = null; // 不正解で「完璧」から外れるためリセット
    }
    rec.nextReviewAt = daysFromNow(rec.interval);
    return rec;
  }
  function classify(rec){
    if(!rec || rec.reviewCount === 0) return 'new';
    const overdue = rec.nextReviewAt && new Date(rec.nextReviewAt) <= new Date();
    if(overdue) return 'due';
    return rec.status || 'learning';
  }
  return { applyResult, classify };
})();

/* ---------------------------------------------------------------------
   6. カード選定ロジック (おまかせ学習 の優先順位)
   優先順位: 未学習 > 要復習 > 不安あり > 覚えた > 完璧
--------------------------------------------------------------------- */
function priorityScore(card){
  const rec = getLearning(card.id);
  const tier = classifyTier(rec);
  const tierIndex = TIER_ORDER.indexOf(tier); // 0=未学習(最優先) ... 4=完璧(最後)
  const base = (TIER_ORDER.length - tierIndex) * 100; // ティアが早いほど高スコア
  return base + Math.random()*8; // 同ティア内はランダム性を持たせる
}
// 出題に必要なデータ(名称/写真/配線図記号/役割)が実際に登録されているかを判定
function cardHasSide(card, side){
  if(side === 'name') return !!(card.name && card.name.trim());
  if(side === 'desc') return !!(card.description && card.description.trim());
  if(side === 'photo') return !!card.photoImage;
  if(side === 'symbol') return !!card.symbolImage;
  return false;
}
function cardHasModeData(card, mode){
  return cardHasSide(card, mode.qSide) && cardHasSide(card, mode.aSide);
}
function validModesForCard(card){
  return QUESTION_MODES.filter(m => SETTINGS.enabledModes[m.id] !== false && cardHasModeData(card, m));
}
function pickModeForCard(card){
  const enabled = validModesForCard(card);
  if(!enabled.length) return null; // このカードで出題できる方向が1つもない
  return enabled[Math.floor(Math.random()*enabled.length)];
}

function buildQueue(cardPool, count, fixedModeId){
  let usablePool;
  let fixedMode = null;
  if(fixedModeId){
    fixedMode = modeById(fixedModeId);
    // 指定された出題方向に必要なデータ(写真・記号・役割)が揃っているカードのみ対象にする
    usablePool = cardPool.filter(c => cardHasModeData(c, fixedMode));
  } else {
    // 少なくとも1つの出題方向が成立するカードのみ対象にする
    usablePool = cardPool.filter(c => validModesForCard(c).length > 0);
  }
  const sorted = [...usablePool].sort((a,b)=> priorityScore(b) - priorityScore(a));
  const chosen = count === Infinity ? sorted : sorted.slice(0, count);
  return chosen
    .map(card => ({ card, mode: fixedMode || pickModeForCard(card) }))
    .filter(item => item.mode);
}

}

/* 画面全体の右スワイプで前の画面に戻る(カード詳細画面などで使用) */
function attachSwipeBack(el){
  if(!el) return;
  let startX=0, startY=0, tracking=false, engaged=false;
  function onStart(x,y,target){
    if(target && target.closest && target.closest('input, textarea, button, .upload-slot, .navbtn')){
      tracking=false; return;
    }
    startX=x; startY=y; tracking=true; engaged=false;
  }
  function onMove(x,y,evt){
    if(!tracking) return;
    const dx = x-startX, dy = y-startY;
    if(!engaged){
      if(Math.abs(dx) > 10 || Math.abs(dy) > 10){
        if(Math.abs(dx) > Math.abs(dy)*1.5 && dx > 0){ engaged = true; }
        else { tracking = false; return; }
      } else return;
    }
    if(engaged){
      if(evt && evt.cancelable) evt.preventDefault();
      const clamped = Math.max(0, dx);
      el.style.transform = `translateX(${clamped}px)`;
      el.style.opacity = String(Math.max(0.4, 1 - clamped/400));
    }
  }
  function onEnd(x){
    if(engaged){
      const dx = x-startX;
      el.style.transition = 'transform .2s ease, opacity .2s ease';
      if(dx > 90){
        el.style.transform = 'translateX(100%)';
        el.style.opacity = '0';
        setTimeout(()=>{ navBack(); }, 150);
      } else {
        el.style.transform = '';
        el.style.opacity = '';
        setTimeout(()=>{ el.style.transition=''; }, 200);
      }
    }
    tracking = false; engaged = false;
  }
  el.addEventListener('touchstart', e=>{ const t=e.touches[0]; onStart(t.clientX, t.clientY, e.target); }, {passive:true});
  el.addEventListener('touchmove', e=>{ const t=e.touches[0]; onMove(t.clientX, t.clientY, e); }, {passive:false});
  el.addEventListener('touchend', e=>{ onEnd(e.changedTouches[0].clientX); });
}

function h(tag, attrs={}, children=[]){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k === 'class') el.className = v;
    else if(k === 'html') el.innerHTML = v;
    else if(k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if(v !== null && v !== undefined) el.setAttribute(k, v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c === null || c === undefined) return;
    if(typeof c === 'string') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  });
  return el;
}

/* ---------------------------------------------------------------------
   カード一覧: 長押し+ドラッグによる並べ替え(同一カテゴリ内のみ)
--------------------------------------------------------------------- */
function slideNeighborIntoPlace(el, oldRect){
  const newRect = el.getBoundingClientRect();
  const dy = oldRect.top - newRect.top;
  if(!dy) return;
  el.style.transition = 'none';
  el.style.transform = `translateY(${dy}px)`;
  // 強制リフローしてから遷移を有効化(FLIPアニメーション)
  void el.offsetHeight;
  requestAnimationFrame(()=>{
    el.style.transition = 'transform 200ms cubic-bezier(.22,.8,.28,1)';
    el.style.transform = '';
  });
  el.addEventListener('transitionend', function te(){ el.style.transition=''; el.removeEventListener('transitionend', te); });
}
function attachReorderGroup(itemEls, category){
  // itemEls: そのカテゴリの card-list-item 要素配列(表示順)。
  // ドラッグは左端の専用ハンドル(⠿)からのみ開始する。カード本体は常にネイティブスクロールに任せ、
  // スクロールと長押し判定が競合しないようにする。
  let order = itemEls.slice(); // 現在の並び(生きたDOM参照)

  itemEls.forEach(item=>{
    const handle = item.querySelector('.cli-draghandle');
    if(!handle) return;
    let dragging = false;
    let startY = 0;

    function onHandleDown(e){
      if(!reorderingEnabled()) return;
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      startY = e.clientY;
      dragging = true;
      item.classList.add('dragging');
      handle.setPointerCapture && handle.setPointerCapture(e.pointerId);
      handle.addEventListener('pointermove', onHandleMove);
      handle.addEventListener('pointerup', onHandleUp);
      handle.addEventListener('pointercancel', onHandleUp);
    }
    function onHandleMove(e){
      if(!dragging) return;
      e.preventDefault();
      const curY = e.clientY;
      item.style.transform = `translateY(${curY-startY}px)`;
      processSwaps(curY);
    }
    function processSwaps(curY){
      // 1回の移動量が大きい場合でも、必要な入れ替えを全て連鎖的に処理する
      let safety = 0;
      while(safety++ < 50){
        const idx = order.indexOf(item);
        const rect = item.getBoundingClientRect();
        const centerY = rect.top + rect.height/2;
        const next = order[idx+1];
        const prev = order[idx-1];
        if(next){
          const r2 = next.getBoundingClientRect();
          if(centerY > r2.top + r2.height/2){
            doSwap(next, idx, idx+1);
            item.style.transform = `translateY(${curY-startY}px)`;
            continue;
          }
        }
        if(prev){
          const r2 = prev.getBoundingClientRect();
          if(centerY < r2.top + r2.height/2){
            doSwap(prev, idx, idx-1);
            item.style.transform = `translateY(${curY-startY}px)`;
            continue;
          }
        }
        break;
      }
    }
    function doSwap(other, itemIdx, otherIdx){
      const otherOldRect = other.getBoundingClientRect();
      const prevTop = item.getBoundingClientRect().top;
      if(otherIdx > itemIdx) item.parentNode.insertBefore(other, item);
      else item.parentNode.insertBefore(item, other);
      slideNeighborIntoPlace(other, otherOldRect);
      order[itemIdx] = other; order[otherIdx] = item;
      const newTop = item.getBoundingClientRect().top;
      startY += (newTop - prevTop);
    }
    function onHandleUp(e){
      if(!dragging) return;
      dragging = false;
      handle.removeEventListener('pointermove', onHandleMove);
      handle.removeEventListener('pointerup', onHandleUp);
      handle.removeEventListener('pointercancel', onHandleUp);
      handle.releasePointerCapture && handle.hasPointerCapture && handle.hasPointerCapture(e.pointerId) && handle.releasePointerCapture(e.pointerId);
      item.classList.remove('dragging');
      // ドロップ位置へふわっと収まるアニメーション
      item.style.transition = 'transform 160ms cubic-bezier(.22,.8,.28,1)';
      item.style.transform = '';
      setTimeout(()=>{ item.style.transition=''; }, 180);
      const newIds = order.map(el=>el.dataset.cardId);
      reorderCategory(category, newIds);
      saveCards();
    }
    // ハンドルでのタップ/ドラッグがカード詳細への遷移を引き起こさないようにする
    handle.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); });
    handle.addEventListener('pointerdown', onHandleDown);
  });
}
function reorderCategory(category, newOrderIds){
  const byId = {};
  CARDS.forEach(c=>{ byId[c.id]=c; });
  let ptr = 0;
  CARDS = CARDS.map(c=>{
    if(c.category === category) return byId[newOrderIds[ptr++]];
    return c;
  });
}

  });

function renderCardListResults(){
  const results = document.getElementById('cardlist-results');
  if(!results) return;
  results.innerHTML = '';
  const q = CARDLIST_QUERY.trim().toLowerCase();
  const f = CARDLIST_FILTERS;
  const anyFilterActive = f.name || f.photo || f.desc || f.symbol;
  const filtered = CARDS.filter(c => {
    const searchMatch = !q || c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q) || (c.tags||[]).some(t=>t.toLowerCase().includes(q));
    if(!searchMatch) return false;
    if(CARDLIST_CATEGORY_FILTER && c.category !== CARDLIST_CATEGORY_FILTER) return false;
    if(CARDLIST_FAV_FILTER === 'fav' && !c.favorite) return false;
    if(CARDLIST_FAV_FILTER === 'nonfav' && c.favorite) return false;
    if(!anyFilterActive) return true;
    const missingName = !c.name || !c.name.trim();
    const missingPhoto = !c.photoImage;
    const missingDesc = !c.description || !c.description.trim();
    const missingSymbol = !c.symbolImage;
    return (f.name && missingName) || (f.photo && missingPhoto) || (f.desc && missingDesc) || (f.symbol && missingSymbol);
  });
  if(!filtered.length){ results.appendChild(h('div',{class:'empty-state'}, '該当するカードがありません')); return; }
  // カテゴリごとにまとまるよう安定ソート(CATEGORY_LISTの順番を基準に、未知のカテゴリは末尾)
  const catIndex = (cat) => { const i = CATEGORY_LIST.indexOf(cat); return i === -1 ? CATEGORY_LIST.length : i; };
  const sorted = filtered
    .map((c, idx) => ({c, idx}))
    .sort((a,b) => (catIndex(a.c.category) - catIndex(b.c.category)) || (a.idx - b.idx))
    .map(x => x.c);
  let lastCategory = null;
  let groupEls = [];
  const flushGroup = ()=>{ if(lastCategory !== null && groupEls.length) attachReorderGroup(groupEls, lastCategory); };
  sorted.forEach(c=>{
    if(c.category !== lastCategory){
      flushGroup();
      results.appendChild(h('div',{class:'section-label', style:'margin-top:4px;'}, c.category || '(カテゴリ未設定)'));
      lastCategory = c.category;
      groupEls = [];
    }
    const item = cardListItem(c);
    results.appendChild(item);
    groupEls.push(item);
  });
  flushGroup();
}

async function saveNewCard(){
  const st = ADD_CARD_STATE;
  if(!st.name || !st.name.trim()){ showToast('名称を入力してください'); return; }
  const id = genUniqueId(st.name.trim());
  const now = new Date().toISOString();
  const tags = st.tags ? st.tags.split('|').map(t=>t.trim()).filter(Boolean) : [];
  const card = {
    id, name:st.name.trim(), category:st.category||'その他', tags,
    difficulty: st.difficulty||2, description: st.description ? st.description.trim() : '',
    symbolImage: !!st.symbolDataUrl, photoImage: !!st.photoDataUrl, favorite: false,
    createdAt: now, updatedAt: now,
  };
  CARDS.push(card);

async function deleteCard(card){
  const idx = CARDS.findIndex(c=>c.id===card.id);
  if(idx !== -1) CARDS.splice(idx, 1);
  delete LEARNING[card.id];
  await saveCards();
  await saveLearning();
  await storeDelete(`img:${card.id}:photo`);
  await storeDelete(`img:${card.id}:symbol`);
  delete IMAGE_CACHE[`${card.id}:photo`];
  delete IMAGE_CACHE[`${card.id}:symbol`];
  DELETE_CONFIRM_MODE = false;
  showToast('カードを削除しました');
  navBack();
}
async function saveNameOrDescription(card){
  if(!card.name || !card.name.trim()){
    showToast('名称は空にできません');
    card.name = card.name && card.name.trim() ? card.name.trim() : card.name;
  }
  card.updatedAt = new Date().toISOString();

  render();
}

function handleCSVFileSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{ await doImportText(reader.result); };
  reader.readAsText(file, 'UTF-8');
}
async function doImportText(text){
  if(!text || !text.trim()){ showToast('CSVが空です'); return; }
  const result = await importCSVText(text, logImport);
  PENDING_IMAGES = PENDING_IMAGES.concat(result.pendingImages||[]);
  render();
}
async function handleBulkImageSelect(e){
  const files = Array.from(e.target.files||[]);
  if(!files.length) return;
  let matched = 0, unmatched = 0;
  for(const file of files){
    const idx = PENDING_IMAGES.findIndex(p => p.filename === file.name);
    if(idx === -1){
      // ファイル名がカードIDそのものと一致するケースも許容 (id.jpg 等)
      const base = file.name.replace(/\.[^.]+$/,'');
      const cardMatch = CARDS.find(c=>c.id===base);
      if(cardMatch){
        try{
          const dataUrl = await processImageFile(file, 'photo');
          await setImage(cardMatch.id, 'photo', dataUrl);
          cardMatch.photoImage = true;
          matched++;
          logImport(`${file.name} → ${cardMatch.name} (写真) に登録`, 'ok');
          continue;
        }catch(err){ unmatched++; continue; }
      }
      unmatched++;
      continue;
    }
    const pending = PENDING_IMAGES[idx];
    const card = CARDS.find(c=>c.id===pending.cardId);
    if(!card){ unmatched++; continue; }
    try{
      const dataUrl = await processImageFile(file, pending.kind);
      await setImage(card.id, pending.kind, dataUrl);
      card[pending.kind+'Image'] = true;
      matched++;
      logImport(`${file.name} → ${card.name} (${pending.kind==='symbol'?'配線図記号':'写真'}) に登録`, 'ok');
      PENDING_IMAGES.splice(idx,1);
    }catch(err){
      unmatched++;
      logImport(`${file.name} の処理に失敗しました`, 'err');
    }
  }
  await saveCards();
  logImport(`画像アップロード完了: 一致 ${matched}件 / 未一致 ${unmatched}件`, matched?'ok':'warn');
  render();
}

   SCREEN: STUDY SESSION
   ========================================================================= */
let SESSION = null; // { queue:[{card,mode}], idx, results:[], revealed:bool }

function startSession(kind, fixedModeId, category, limit){
  let pool = CARDS;
  if(kind === 'omakase') pool = CARDS.filter(c=> classifyTier(LEARNING[c.id]) !== 'perfect'); // 「完璧」は出題対象外
  if(kind === 'category' && category) pool = CARDS.filter(c=>c.category===category);
  if(kind === 'weak') pool = CARDS.filter(c=>{
    const rec = LEARNING[c.id];
    return rec && rec.reviewCount>=2 && (rec.incorrectCount/rec.reviewCount)>=0.34;
  });
  if(kind === 'unlearned') pool = CARDS.filter(c=> !LEARNING[c.id] || LEARNING[c.id].reviewCount===0);
  if(kind === 'tier') pool = CARDS.filter(c=> classifyTier(LEARNING[c.id]) === category); // category に tier id を渡す
  if(kind === 'forgetting') pool = forgettingCardsForDays(category); // category に経過日数を渡す

  if(!pool.length){ showToast('対象のカードがありません'); return; }

  let count;
  if(limit) count = limit;
  else if(SETTINGS.questionCount === 'all') count = Infinity;
  else count = SETTINGS.questionCount || 40;

  const queue = buildQueue(pool, count, kind==='single' ? fixedModeId : null);
  if(!queue.length){ showToast('出題可能なカードがありません(画像未登録の可能性)'); return; }

  SESSION = { queue, idx:0, results:[], revealed:false, kind, forgettingDays: (kind==='forgetting' ? category : null) };
  nav('study');
}

function currentQA(){
  const item = SESSION.queue[SESSION.idx];
  const {card, mode} = item;
  return {card, mode};
}
function sideContent(card, side){
  if(side === 'name') return {type:'text', value:card.name};
  if(side === 'desc') return {type:'text', value:card.description || '(役割の記載なし)'};
  if(side === 'symbol') return {type:'image', kind:'symbol'};
  if(side === 'photo') return {type:'image', kind:'photo'};
}

// 出題方向(qSide)ごとに、回答表示で見せるべき項目を定義。
// 「登録されている部分だけ表示」の判定は呼び出し側(renderAnswer)で行う。
function answerFieldsForMode(qSide){
  switch(qSide){
    case 'symbol': return ['name','photo'];        // 配線図記号の出題 → 名称+写真
    case 'desc':   return ['name','photo'];        // 役割の出題       → 名称+写真
    case 'photo':  return ['name','symbol','desc']; // 写真の出題       → 名称+配線図記号+役割・用途
    case 'name':   return ['photo','desc','symbol']; // 名称の出題      → 写真+役割+配線図記号
    default:       return ['name'];
  }
}
function renderAnswer(wrap, card, mode){
  wrap.innerHTML = '';
  wrap.appendChild(h('div',{class:'fc-divider'}));
  const box = h('div',{class:'fc-answer'});
  box.appendChild(h('div',{class:'a-label'}, '答え'));

  const fields = answerFieldsForMode(mode.qSide);
  fields.forEach(field=>{
    if(field === 'name'){
      box.appendChild(h('div',{class:'a-name'}, card.name));
    } else if(field === 'photo' && card.photoImage){
      box.appendChild(h('div',{class:'a-sublabel'}, '写真'));
      const mwrap = h('div',{class:'a-media'});
      const img = h('img',{alt:''});
      mwrap.appendChild(img);
      getImage(card.id, 'photo').then(src=>{ if(src) img.src = src; });
      box.appendChild(mwrap);
    } else if(field === 'symbol' && card.symbolImage){
      box.appendChild(h('div',{class:'a-sublabel'}, '配線図記号'));
      const mwrap = h('div',{class:'a-media symbol'});
      const img = h('img',{alt:''});
      mwrap.appendChild(img);
      getImage(card.id, 'symbol').then(src=>{ if(src) img.src = src; });
      box.appendChild(mwrap);
    } else if(field === 'desc' && card.description){
      box.appendChild(h('div',{class:'a-sublabel'}, '役割・用途'));
      box.appendChild(h('div',{class:'a-desc'}, card.description));
    }
  });
  wrap.appendChild(box);
}

function attachSwipe(fc){
  if(!fc) return;
  let startX=0, startY=0, dx=0, dragging=false, decided=false;
  const flash = fc.querySelector('#swipe-flash');
  function reset(){
    fc.style.transition = 'transform .25s ease';
    fc.style.transform = '';
    if(flash){ flash.style.opacity = 0; flash.className='swipe-flash'; }
    setTimeout(()=>{ fc.style.transition=''; }, 250);
  }
  function onDown(x,y){
    if(!SESSION.revealed) return;
    dragging = true; decided=false; startX=x; startY=y; SESSION._dragging=false;
  }
  function onMove(x,y){
    if(!dragging) return;
    dx = x-startX;
    if(Math.abs(dx) > 8) SESSION._dragging = true;
    const rot = dx/18;
    fc.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    if(flash){
      const p = Math.min(Math.abs(dx)/110, 1);
      flash.style.opacity = p*0.9;
      flash.className = 'swipe-flash ' + (dx>0?'correct':'incorrect');
    }
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    if(Math.abs(dx) > 90){
      const isCorrect = dx>0;
      fc.style.transition='transform .3s ease'; fc.style.transform=`translateX(${isCorrect?600:-600}px) rotate(${dx/10}deg)`;
      setTimeout(()=>judge(isCorrect), 180);
    } else {
      reset();
    }
    dx = 0;
    setTimeout(()=>{ SESSION._dragging=false; }, 50);
  }
  fc.addEventListener('touchstart', e=>{ const t=e.touches[0]; onDown(t.clientX,t.clientY); }, {passive:true});
  fc.addEventListener('touchmove', e=>{ const t=e.touches[0]; onMove(t.clientX,t.clientY); }, {passive:true});
  fc.addEventListener('touchend', onUp);
  fc.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>{ if(dragging) onMove(e.clientX,e.clientY); });
  window.addEventListener('mouseup', onUp);
}

async function judge(isCorrect){
  if(!SESSION || !SESSION.revealed) return;
  const {card, mode} = currentQA();
  const rec = getLearning(card.id);
  ReviewScheduler.applyResult(rec, isCorrect, mode.id);
  await saveLearning();
  const today = todayDateStr();
  if(!STUDY_DAYS[today]){ STUDY_DAYS[today] = true; await saveStudyDays(); }
  SESSION.results.push({cardId:card.id, mode:mode.id, correct:isCorrect});
  SESSION.idx++;
  SESSION.revealed = false;
  if(SESSION.idx >= SESSION.queue.length){
    if(SESSION.kind === 'forgetting' && SESSION.forgettingDays){
      markForgettingCompletedToday(SESSION.forgettingDays);
      await saveSettings();
    }
    nav('result', {}, true);
  } else {
    render();
  }
}

let HISTORY_CAL_YEAR = null, HISTORY_CAL_MONTH = null; // HISTORY_CAL_MONTH は 0-indexed
let HISTORY_SORT_INCORRECT_DESC = false;
function ensureHistoryCalendarInit(){
  if(HISTORY_CAL_YEAR === null){
    const now = new Date();
    HISTORY_CAL_YEAR = now.getFullYear();
    HISTORY_CAL_MONTH = now.getMonth();
  }
}
function shiftCalendarMonth(delta){
  HISTORY_CAL_MONTH += delta;
  if(HISTORY_CAL_MONTH < 0){ HISTORY_CAL_MONTH = 11; HISTORY_CAL_YEAR--; }
  if(HISTORY_CAL_MONTH > 11){ HISTORY_CAL_MONTH = 0; HISTORY_CAL_YEAR++; }
}
const CAL_WEEKDAY_LABELS = ['日','月','火','水','木','金','土'];
function buildCalendarNav(){
  return h('div',{class:'cal-nav'},[
    h('button',{class:'cal-nav-btn', onclick:()=>{ shiftCalendarMonth(-1); render(); }}, '‹'),
    h('div',{class:'cal-nav-label'}, `${HISTORY_CAL_YEAR}年${HISTORY_CAL_MONTH+1}月`),
    h('button',{class:'cal-nav-btn', onclick:()=>{ shiftCalendarMonth(1); render(); }}, '›')
  ]);
}
function buildCalendarGrid(){
  const grid = h('div',{class:'cal-grid'});
  CAL_WEEKDAY_LABELS.forEach(w=> grid.appendChild(h('div',{class:'cal-weekday'}, w)));
  const firstDay = new Date(HISTORY_CAL_YEAR, HISTORY_CAL_MONTH, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(HISTORY_CAL_YEAR, HISTORY_CAL_MONTH+1, 0).getDate();
  for(let i=0;i<startWeekday;i++) grid.appendChild(h('div',{class:'cal-cell empty'}));
  const todayStr = todayDateStr();
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${HISTORY_CAL_YEAR}-${String(HISTORY_CAL_MONTH+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const studied = !!STUDY_DAYS[dateStr];
    const isToday = dateStr === todayStr;
    grid.appendChild(h('div',{class:'cal-cell'+(isToday?' today':'')},[
      h('span',{class:'cal-daynum'}, String(d)),
      studied ? h('span',{class:'cal-stamp'}, '済') : null
    ]));
  }
  return grid;
}
function attachCalendarSwipe(){
  const el = document.getElementById('history-calendar-panel');
  if(!el) return;
  let startX=0, startY=0, tracking=false, pid=null;
  el.addEventListener('pointerdown', e=>{
    startX = e.clientX; startY = e.clientY; tracking = true; pid = e.pointerId;
  });
  el.addEventListener('pointerup', e=>{
    if(!tracking || e.pointerId !== pid) return;
    tracking = false;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)*1.5){
      if(dx > 0) shiftCalendarMonth(-1); // 右スワイプ → 前月
      else shiftCalendarMonth(1);        // 左スワイプ → 翌月
      render();
    }
  });
  el.addEventListener('pointercancel', ()=>{ tracking = false; });
}
function historyCardRow(card){

  ensureHistoryCalendarInit();

  root.appendChild(topbar('学習履歴', `全${CARDS.length}枚`));

let RESET_CONFIRM_MODE = false;
async function resetLearningHistory(){
  LEARNING = {};
  STUDY_DAYS = {};
  await saveLearning();
  await saveStudyDays();
  RESET_CONFIRM_MODE = false;
  showToast('学習履歴をリセットしました');
  render();
}
async function exportBackup(){
  const images = {};
  const list = await store.list('img:', false).catch(()=>({keys:[]}));
  const keys = (list && list.keys) || [];
  for(const k of keys){
    const val = await storeGetText(k);
    if(val) images[k] = val;
  }
  const backup = { version:1, exportedAt:new Date().toISOString(), cards:CARDS, learning:LEARNING, settings:SETTINGS, studyDays:STUDY_DAYS, images };
  const blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `electrician_flashcards_backup_${Date.now()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('バックアップを書き出しました');
}
function csvEscape(v){
  const s = String(v === undefined || v === null ? '' : v);
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportCardsCSV(){
  if(!CARDS.length){ showToast('書き出せるカードがありません'); return; }
  // インポート画面と同じ列構成(id,name,category,tags,difficulty,description,symbolImageFile,photoImageFile)。
  // 画像本体はCSVに含められないため、symbolImageFile/photoImageFileは空欄で出力する
  // (これらの列を空のまま再インポートしても、既存カードの画像登録状況は保持される)。
  const headers = ['id','name','category','tags','difficulty','description','symbolImageFile','photoImageFile'];
  const lines = [headers.join(',')];
  CARDS.forEach(c=>{
    const row = [
      c.id, c.name || '', c.category || '', (c.tags||[]).join('|'),
      c.difficulty != null ? c.difficulty : 2, c.description || '', '', ''
    ];
    lines.push(row.map(csvEscape).join(','));
  });
  const csv = '\uFEFF' + lines.join('\r\n'); // BOM付き(Excelで開いても文字化けしないように)
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `electrician_flashcards_${Date.now()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast(`CSVを書き出しました(${CARDS.length}件)`);
}
async function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup.cards) throw new Error('invalid backup');
    CARDS = backup.cards || [];
    LEARNING = backup.learning || {};
    SETTINGS = Object.assign({...DEFAULT_SETTINGS}, backup.settings||{});
    STUDY_DAYS = backup.studyDays || {};
    await saveCards(); await saveLearning(); await saveSettings(); await saveStudyDays();
    // 復元したカードが持つカテゴリを選択肢に反映(追加済みカスタムカテゴリも復元後すぐ選べるように)
    CARDS.forEach(c=>{ if(c.category && !CATEGORY_LIST.includes(c.category)) CATEGORY_LIST.push(c.category); });
    if(backup.images){
      for(const [k,v] of Object.entries(backup.images)){
        await storeSetText(k, v);
      }
      IMAGE_CACHE = {};
    }
    showToast('バックアップを復元しました');
    render();
  }catch(err){
    console.error(err);
    showToast('復元に失敗しました。ファイルを確認してください');
  }
}
