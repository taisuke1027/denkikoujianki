<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>電工二種 暗記カード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220;
  --bg-elevated:#121B2E;
  --bg-elevated-2:#182338;
  --line: rgba(255,255,255,0.08);
  --card:#FBF8F2;
  --card-ink:#1B2430;
  --ink:#E9EDF4;
  --ink-dim:#9AA6B8;
  --accent:#C8722A;
  --accent-soft:rgba(200,114,42,0.18);
  --teal:#4FA6A0;
  --teal-soft:rgba(79,166,160,0.18);
  --danger:#C0453A;
  --danger-soft:rgba(192,69,58,0.18);
  --amber:#D6A93B;
  --radius:18px;
  --radius-sm:12px;
  --font-display:'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  --font-body:'Noto Sans JP', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);}
body{
  font-family:var(--font-body);
  color:var(--ink);
  overscroll-behavior-y:none;
  min-height:100vh;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(200,114,42,0.10), transparent 60%),
    linear-gradient(180deg, #0B1220 0%, #0B1220 100%);
}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
.hairline{height:1px;background:var(--line);border:none;margin:0;}

/* ---------- Header ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:14px 16px calc(14px + env(safe-area-inset-top,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:rgba(11,18,32,0.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar .back{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;
  color:var(--ink);cursor:pointer;flex-shrink:0;
}
.topbar .title{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.02em;flex:1;}
.topbar .title small{display:block;font-family:var(--font-mono);font-weight:400;font-size:10px;color:var(--ink-dim);letter-spacing:.08em;margin-top:1px;}

.screen{flex:1;display:flex;flex-direction:column;padding:16px 16px calc(90px + env(safe-area-inset-bottom,0px));gap:16px;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  max-width:520px;margin:0 auto;
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  background:rgba(18,27,46,0.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
}
.navbtn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--ink-dim);font-family:var(--font-body);
  font-size:10.5px;padding:6px 10px;border-radius:10px;cursor:pointer;
}
.navbtn.active{color:var(--accent);}
.navbtn svg{width:20px;height:20px;}

/* ---------- Cards / sections ---------- */
.section-label{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--ink-dim);
  text-transform:uppercase;display:flex;align-items:center;gap:8px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--line);}

.panel{
  background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;
}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-tile{
  background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px 14px;position:relative;overflow:hidden;
}
.stat-tile .num{font-family:var(--font-display);font-weight:900;font-size:28px;line-height:1;}
.stat-tile .label{font-size:12px;color:var(--ink-dim);margin-top:6px;}
.stat-tile.due .num{color:var(--danger);}
.stat-tile.new .num{color:var(--ink-dim);}
.stat-tile.learning .num{color:var(--amber);}
.stat-tile.mastered .num{color:var(--teal);}

.gauge-wrap{display:flex;align-items:center;gap:16px;}
.gauge{width:88px;height:88px;flex-shrink:0;}
.gauge-text .big{font-family:var(--font-display);font-weight:900;font-size:22px;}
.gauge-text .small{font-size:12px;color:var(--ink-dim);margin-top:2px;}

.cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:18px;border-radius:16px;border:none;cursor:pointer;
  background:linear-gradient(135deg, var(--accent), #A9591B);
  color:#fff;font-family:var(--font-display);font-weight:700;font-size:16px;
  box-shadow:0 10px 24px -8px rgba(200,114,42,0.55);
}
.cta:active{transform:scale(0.98);}
.cta .sub{display:block;font-family:var(--font-mono);font-weight:400;font-size:11px;opacity:.85;margin-top:2px;}

.btn{
  padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg-elevated-2);
  color:var(--ink);font-family:var(--font-body);font-size:14px;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:10px;
}
.btn:active{transform:scale(0.98);}
.btn.primary{background:var(--accent-soft);border-color:rgba(200,114,42,0.4);color:var(--accent);font-weight:700;}
.btn.ghost{background:transparent;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;justify-content:center;}

.mode-list{display:flex;flex-direction:column;gap:8px;}
.mode-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 14px;border-radius:var(--radius-sm);background:var(--bg-elevated);
  border:1px solid var(--line);cursor:pointer;
}
.mode-item:active{transform:scale(0.99);}
.mode-item .arrow{font-family:var(--font-mono);color:var(--accent);font-size:13px;white-space:nowrap;}
.mode-item .name{font-weight:500;font-size:14px;}
.mode-item .count{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg-elevated);
  font-size:12.5px;color:var(--ink-dim);cursor:pointer;font-family:var(--font-body);
}
.chip.active{background:var(--accent-soft);border-color:rgba(200,114,42,0.5);color:var(--accent);font-weight:700;}

.search-input, .text-input, textarea.text-input{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg-elevated-2);color:var(--ink);font-family:var(--font-body);font-size:14px;
}
textarea.text-input{resize:vertical;font-family:var(--font-mono);font-size:12px;min-height:120px;}
.search-input::placeholder,.text-input::placeholder{color:var(--ink-dim);}

.card-list-item{
  display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--radius-sm);
  background:var(--bg-elevated);border:1px solid var(--line);cursor:pointer;
}
.thumb{
  width:52px;height:52px;border-radius:10px;background:var(--bg-elevated-2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line);
}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb.symbol img{object-fit:contain;padding:6px;background:#fff;}
.cli-body{flex:1;min-width:0;}
.cli-name{font-weight:700;font-size:14px;}
.cli-meta{font-size:11px;color:var(--ink-dim);font-family:var(--font-mono);margin-top:2px;}
.badge{
  font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:6px;letter-spacing:.03em;
}
.badge.new{background:rgba(154,166,184,0.15);color:var(--ink-dim);}
.badge.learning{background:var(--amber);color:#2a2000;background:rgba(214,169,59,0.2);color:var(--amber);}
.badge.mastered{background:var(--teal-soft);color:var(--teal);}
.badge.due{background:var(--danger-soft);color:var(--danger);}

/* ---------- Study screen ---------- */
.study-progress{display:flex;align-items:center;gap:10px;}
.progress-track{flex:1;height:5px;border-radius:99px;background:var(--bg-elevated-2);overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease;}
.study-count{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);white-space:nowrap;}

.card-stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:420px;padding:6px 0;}
.flashcard{
  width:100%;max-width:380px;min-height:420px;border-radius:22px;background:var(--card);color:var(--card-ink);
  box-shadow:0 20px 50px -18px rgba(0,0,0,0.6);position:relative;overflow:hidden;
  display:flex;flex-direction:column;cursor:pointer;user-select:none;touch-action:pan-y;
  border:1px solid rgba(0,0,0,0.06);
}
.flashcard::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(27,36,48,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(27,36,48,0.04) 1px, transparent 1px);
  background-size:18px 18px;
}
.fc-tick{position:absolute;width:10px;height:10px;border:2px solid rgba(27,36,48,0.18);}
.fc-tick.tl{top:10px;left:10px;border-right:none;border-bottom:none;}
.fc-tick.tr{top:10px;right:10px;border-left:none;border-bottom:none;}
.fc-tick.bl{bottom:10px;left:10px;border-right:none;border-top:none;}
.fc-tick.br{bottom:10px;right:10px;border-left:none;border-top:none;}

.fc-eyebrow{
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;color:#8a7a5c;
  padding:20px 22px 0;text-transform:uppercase;position:relative;z-index:1;
}
.fc-question{
  font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.5;
  padding:8px 22px 0;position:relative;z-index:1;
}
.fc-media{
  flex:1;display:flex;align-items:center;justify-content:center;padding:16px 26px;position:relative;z-index:1;min-height:150px;
}
.fc-media img{max-width:100%;max-height:220px;object-fit:contain;}
.fc-media.symbol img{background:#fff;border-radius:10px;padding:14px;border:1px solid rgba(0,0,0,0.08);}
.fc-media .desc-text{font-size:17px;line-height:1.7;font-weight:500;text-align:center;}
.fc-hint{
  text-align:center;font-family:var(--font-mono);font-size:10.5px;color:#a8987a;padding:0 20px 18px;
  letter-spacing:.05em;position:relative;z-index:1;
}
.fc-divider{height:1px;background:rgba(27,36,48,0.1);margin:0 22px;position:relative;z-index:1;}
.fc-answer{padding:16px 22px 22px;position:relative;z-index:1;}
.fc-answer .a-label{font-family:var(--font-mono);font-size:10px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;}
.fc-answer .a-name{font-family:var(--font-display);font-weight:900;font-size:22px;margin-top:4px;}
.fc-answer .a-media{margin-top:10px;display:flex;justify-content:center;}
.fc-answer .a-media img{max-height:120px;max-width:100%;object-fit:contain;}
.fc-answer .a-desc{font-size:13.5px;color:#5a6270;margin-top:8px;line-height:1.6;}

.swipe-flash{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:900;font-size:34px;border-radius:22px;
  opacity:0;pointer-events:none;letter-spacing:.05em;
}
.swipe-flash.correct{background:rgba(79,166,160,0.88);color:#fff;}
.swipe-flash.incorrect{background:rgba(192,69,58,0.88);color:#fff;}

.judge-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 6px;}
.judge-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 10px;border-radius:16px;
  border:1px solid var(--line);background:var(--bg-elevated);cursor:pointer;font-family:var(--font-body);
}
.judge-btn:active{transform:scale(0.96);}
.judge-btn.incorrect{color:var(--danger);}
.judge-btn.correct{color:var(--teal);}
.judge-btn .arrow-ico{font-size:18px;}
.judge-btn .txt{font-size:12px;font-weight:700;}
.judge-hint{opacity:.5;}

/* ---------- Result screen ---------- */
.result-hero{text-align:center;padding:20px 0 6px;}
.result-hero .pct{font-family:var(--font-display);font-weight:900;font-size:52px;color:var(--accent);}
.result-hero .lbl{color:var(--ink-dim);font-size:13px;margin-top:2px;}
.result-stats{display:flex;justify-content:center;gap:26px;margin-top:14px;}
.result-stat{text-align:center;}
.result-stat .n{font-family:var(--font-mono);font-weight:700;font-size:20px;}
.result-stat.ok .n{color:var(--teal);}
.result-stat.ng .n{color:var(--danger);}
.result-stat .l{font-size:11px;color:var(--ink-dim);}

/* ---------- Detail screen ---------- */
.detail-hero-img{width:100%;height:200px;border-radius:16px;background:var(--bg-elevated);object-fit:cover;border:1px solid var(--line);}
.detail-symbol-box{background:#fff;border-radius:14px;padding:16px;display:flex;justify-content:center;}
.detail-symbol-box img{max-height:110px;max-width:100%;object-fit:contain;}
.kv-row{display:flex;justify-content:space-between;padding:9px 0;font-size:13px;border-bottom:1px solid var(--line);}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--ink-dim);}
.kv-row .v{font-family:var(--font-mono);font-weight:700;}
.upload-slot{
  border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--ink-dim);
  font-size:12px;cursor:pointer;position:relative;
}
.upload-slot input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.upload-slot.filled{border-style:solid;border-color:var(--teal);color:var(--teal);}

/* ---------- Import screen ---------- */
.step-badge{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:7px;
  background:var(--accent-soft);color:var(--accent);font-family:var(--font-mono);font-size:11px;font-weight:700;flex-shrink:0;
}
.step-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;font-family:var(--font-display);}
.dropzone{
  border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;position:relative;cursor:pointer;
}
.dropzone input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.dropzone .dz-title{font-weight:700;font-size:13.5px;}
.dropzone .dz-sub{font-size:11px;color:var(--ink-dim);margin-top:4px;font-family:var(--font-mono);}
.log-box{
  background:var(--bg-elevated-2);border-radius:12px;padding:10px 12px;font-family:var(--font-mono);font-size:11px;
  color:var(--ink-dim);max-height:160px;overflow:auto;white-space:pre-wrap;line-height:1.6;
}
.log-box .ok{color:var(--teal);}
.log-box .warn{color:var(--amber);}
.log-box .err{color:var(--danger);}

.toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:100;
  background:var(--bg-elevated-2);border:1px solid var(--line);border-radius:12px;padding:10px 18px;
  font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,0.4);opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 20px;
  color:var(--ink-dim);text-align:center;font-size:13px;
}
.empty-state .ico{font-size:30px;opacity:.5;}

::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="cards_data.js"></script>
<script>
/* =========================================================================
   電工二種 暗記カードアプリ — 単一ファイル実装
   構成:
   1. Storage layer (window.storage 抽象化 + フォールバック)
   2. データモデル / カード・学習履歴・画像 の分離管理
   3. 画像処理 (リサイズ + WebP変換)
   4. CSV パーサ & インポート
   5. 復習アルゴリズム (忘却曲線モジュール, UIから独立)
   6. ルータ & 画面描画
   ========================================================================= */

/* ---------------------------------------------------------------------
   1. STORAGE LAYER
   window.storage が使えない環境でも動くよう、メモリフォールバックを用意。
   キー設計:
     "cards"            -> カードマスターデータ配列 (JSON)
     "learning"         -> 学習履歴 (cardId をキーにしたオブジェクト, JSON)
     "settings"         -> アプリ設定 (JSON)
     "img:<cardId>:photo"  -> 写真画像 (webp dataURL, テキスト)
     "img:<cardId>:symbol" -> 配線図記号画像 (webp dataURL, テキスト)
   カードデータと学習履歴・画像を別キーに分離することで、
   カードデータを更新しても学習履歴が破壊されないようにしている。
--------------------------------------------------------------------- */
const MemoryFallback = (() => {
  const mem = {};
  return {
    async get(key){ return (key in mem) ? {key, value: mem[key], shared:false} : null; },
    async set(key, value){ mem[key] = value; return {key, value, shared:false}; },
    async delete(key){ const existed = key in mem; delete mem[key]; return {key, deleted:existed, shared:false}; },
    async list(prefix){ const keys = Object.keys(mem).filter(k => !prefix || k.startsWith(prefix)); return {keys, prefix, shared:false}; }
  };
})();
const store = (window.storage && window.storage.get) ? window.storage : MemoryFallback;

async function storeGetJSON(key, fallback){
  try{
    const res = await store.get(key, false);
    if(!res || res.value === undefined) return fallback;
    return JSON.parse(res.value);
  }catch(e){ return fallback; }
}
async function storeSetJSON(key, obj){
  try{ await store.set(key, JSON.stringify(obj), false); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function storeGetText(key){
  try{
    const res = await store.get(key, false);
    return res ? res.value : null;
  }catch(e){ return null; }
}
async function storeSetText(key, text){
  try{ await store.set(key, text, false); return true; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function storeDelete(key){
  try{ await store.delete(key, false); }catch(e){}
}

/* ---------------------------------------------------------------------
   2. IN-MEMORY STATE (loaded from storage at boot)
--------------------------------------------------------------------- */
const DEFAULT_SETTINGS = {
  questionCount: 10,          // 1回の出題数デフォルト
  randomOrder: true,          // ランダム性を出題順に反映
  enabledModes: {             // 出題方向ごとの有効/無効(将来拡張しやすい構造)
    symbol2name:true, photo2name:true, desc2name:true, name2desc:true
  }
};

let CARDS = [];        // カードマスターデータ
let LEARNING = {};      // { [cardId]: LearningRecord }
let SETTINGS = {...DEFAULT_SETTINGS};
let IMAGE_CACHE = {};   // { "cardId:photo": dataUrl } メモリキャッシュ(遅延読み込み用)

// 出題方向の定義。将来の拡張(写真⇄記号 等)もこの配列に足すだけで対応できる。
const QUESTION_MODES = [
  { id:'symbol2name', label:'配線図記号 → 名称', qSide:'symbol', aSide:'name', qLabel:'この配線図記号の名称は?' },
  { id:'photo2name',  label:'写真 → 名称',       qSide:'photo',  aSide:'name', qLabel:'この器具の名称は?' },
  { id:'desc2name',   label:'役割 → 名称',       qSide:'desc',   aSide:'name', qLabel:'次の役割を持つ器具は?' },
  { id:'name2desc',   label:'名称 → 役割',       qSide:'name',   aSide:'desc', qLabel:'この役割は?' },
];
function modeById(id){ return QUESTION_MODES.find(m=>m.id===id); }

function newLearningRecord(){
  return {
    status:'new',            // new | learning | mastered
    reviewCount:0, correctCount:0, incorrectCount:0,
    correctStreak:0, incorrectStreak:0,
    lastReviewedAt:null, nextReviewAt:null, interval:0,
    modeStats:{}              // { modeId: {reviewCount,correct,incorrect} } 方向別正解率(42章)
  };
}
function getLearning(cardId){
  if(!LEARNING[cardId]) LEARNING[cardId] = newLearningRecord();
  return LEARNING[cardId];
}

async function loadAll(){
  const existing = await store.get('cards', false).catch(()=>null);
  if(!existing || existing.value === undefined){
    // 初回起動: プリインストールされたデフォルトカードセットを読み込む(cards_data.js)
    await installDefaultDeckIfAvailable();
  }

}
async function installDefaultDeckIfAvailable(){
  if(typeof window.DEFAULT_CARDS === 'undefined') { await storeSetJSON('cards', []); return; }
  try{
    CARDS = JSON.parse(JSON.stringify(window.DEFAULT_CARDS));
    await saveCards();
    const images = window.DEFAULT_IMAGES || {};
    const keys = Object.keys(images);
    for(let i=0;i<keys.length;i++){
      await storeSetText(keys[i], images[keys[i]]);
    }
  }catch(e){
    console.error('デフォルトカードの初期化に失敗しました', e);
    await storeSetJSON('cards', []);
  }
}

/* ---------------------------------------------------------------------
   3. 画像処理: リサイズ + WebP変換
   元画像をそのまま保存しない。写真は長辺1000px、記号は長辺700px を目安に縮小。
--------------------------------------------------------------------- */
function fileToImage(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
async function processImageFile(file, kind){
  const maxDim = kind === 'symbol' ? 700 : 1000;
  const img = await fileToImage(file);
  let {width, height} = img;
  if(width > height){ if(width > maxDim){ height = Math.round(height*maxDim/width); width = maxDim; } }
  else { if(height > maxDim){ width = Math.round(width*maxDim/height); height = maxDim; } }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, width, height);
  // WebP変換を試み、非対応環境ではPNG/JPEGにフォールバック
  let dataUrl = canvas.toDataURL('image/webp', 0.82);
  if(!dataUrl.startsWith('data:image/webp')){
    dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  }
  return dataUrl;
}

/* ---------------------------------------------------------------------
   4. CSV パーサ & インポート
   期待するヘッダ例:
   id,name,category,tags,difficulty,description,symbolImageFile,photoImageFile
   (id は空でも自動採番。tags は "|" 区切り)
--------------------------------------------------------------------- */
function parseCSV(text){
  // シンプルだが引用符(",")対応のCSVパーサ
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(field); field='';
        if(row.length > 1 || row[0] !== ''){ rows.push(row); }
        row = [];
      } else field += c;
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.some(c=>c.trim()!=='')).map(r=>{
    const obj = {};
    headers.forEach((h,idx)=> obj[h] = (r[idx] !== undefined ? r[idx].trim() : ''));
    return obj;
  });
}

const CATEGORY_LIST = ['配線器具','電線','ケーブル','工具','材料','スイッチ','コンセント','照明器具','電気工事','その他'];

function slugId(name, idx){
  const base = 'card_' + (name||'').replace(/[^\p{L}\p{N}]/gu,'').slice(0,12);
  return base ? base + '_' + idx : 'card_' + idx;
}

async function importCSVText(text, logFn){
  const rows = parseCSV(text);
  if(!rows.length){ logFn('CSVにデータ行が見つかりませんでした。', 'err'); return {imported:0, pendingImages:[]}; }
  let imported = 0, updated = 0;
  const pendingImages = []; // { cardId, kind, filename }
  const existingIds = new Set(CARDS.map(c=>c.id));
  rows.forEach((r, idx)=>{
    if(!r.name){ logFn(`行${idx+2}: name が空のためスキップしました。`, 'warn'); return; }
    let id = r.id && r.id.trim() ? r.id.trim() : slugId(r.name, idx+1);
    let cat = r.category && r.category.trim() ? r.category.trim() : 'その他';
    if(!CATEGORY_LIST.includes(cat)) CATEGORY_LIST.push(cat);
    const tags = r.tags ? r.tags.split('|').map(t=>t.trim()).filter(Boolean) : [];
    const now = new Date().toISOString();
    const existing = CARDS.find(c=>c.id===id);
    const cardData = {
      id, name:r.name.trim(), category:cat, tags,
      difficulty: r.difficulty ? Number(r.difficulty)||2 : 2,
      description: r.description ? r.description.trim() : '',
      symbolImage: existing ? existing.symbolImage : null,
      photoImage: existing ? existing.photoImage : null,
      createdAt: existing ? existing.createdAt : now,
      updatedAt: now,
    };
    if(existing){
      Object.assign(existing, cardData);
      updated++;
    } else {
      CARDS.push(cardData);
      imported++;
    }
    if(r.symbolImageFile && r.symbolImageFile.trim()) pendingImages.push({cardId:id, kind:'symbol', filename:r.symbolImageFile.trim()});
    if(r.photoImageFile && r.photoImageFile.trim()) pendingImages.push({cardId:id, kind:'photo', filename:r.photoImageFile.trim()});
  });
  await saveCards();
  logFn(`インポート完了: 新規 ${imported}件 / 更新 ${updated}件`, 'ok');
  if(pendingImages.length){
    logFn(`画像ファイル参照 ${pendingImages.length}件を検出しました。下の画像アップロードで一括登録できます。`, 'warn');
  }
  return {imported, updated, pendingImages};
}

/* ---------------------------------------------------------------------
   5. 復習アルゴリズム(忘却曲線モジュール) — UI/データから独立させ、
      将来より高度なアルゴリズムに差し替えやすい構造にする。
--------------------------------------------------------------------- */
const ReviewScheduler = (() => {
  const CORRECT_INTERVALS = [1,3,7,14,30,60,120]; // streak 1..7+ (7以降は120固定、以後+60ずつ延長)
  const INCORRECT_INTERVALS = [1,1,3,7];
  function daysFromNow(days){
    const d = new Date();
    d.setDate(d.getDate() + days);
    return d.toISOString();
  }
  function intervalForCorrectStreak(streak){
    if(streak <= CORRECT_INTERVALS.length) return CORRECT_INTERVALS[streak-1];
    // 6回目以降は120日、さらに以後60日ずつ延長
    const extra = streak - CORRECT_INTERVALS.length;
    return CORRECT_INTERVALS[CORRECT_INTERVALS.length-1] + extra*60;
  }
  function intervalForIncorrectStreak(streak){
    const idx = Math.min(streak-1, INCORRECT_INTERVALS.length-1);
    return INCORRECT_INTERVALS[idx];
  }
  function applyResult(rec, isCorrect, modeId){
    rec.reviewCount++;
    rec.lastReviewedAt = new Date().toISOString();
    if(!rec.modeStats[modeId]) rec.modeStats[modeId] = {reviewCount:0, correct:0, incorrect:0};
    rec.modeStats[modeId].reviewCount++;
    if(isCorrect){
      rec.correctCount++;
      rec.correctStreak++;
      rec.incorrectStreak = 0;
      rec.modeStats[modeId].correct++;
      rec.interval = intervalForCorrectStreak(rec.correctStreak);
      rec.status = rec.correctStreak >= 5 ? 'mastered' : 'learning';
    } else {
      rec.incorrectCount++;
      rec.incorrectStreak++;
      rec.correctStreak = 0;
      rec.modeStats[modeId].incorrect++;
      rec.interval = intervalForIncorrectStreak(rec.incorrectStreak);
      rec.status = 'learning';
    }
    rec.nextReviewAt = daysFromNow(rec.interval);
    return rec;
  }
  function classify(rec){
    if(!rec || rec.reviewCount === 0) return 'new';
    const overdue = rec.nextReviewAt && new Date(rec.nextReviewAt) <= new Date();
    if(overdue) return 'due';
    return rec.status || 'learning';
  }
  return { applyResult, classify };
})();

/* ---------------------------------------------------------------------
   6. カード選定ロジック (おまかせ学習 / 今日の復習 の優先順位)
--------------------------------------------------------------------- */
function priorityScore(card){
  const rec = getLearning(card.id);
  const now = new Date();
  const overdue = rec.nextReviewAt && new Date(rec.nextReviewAt) < now;
  const dueToday = rec.nextReviewAt && sameDay(new Date(rec.nextReviewAt), now);
  let score = 0;
  if(overdue) score += 1000 + (now - new Date(rec.nextReviewAt))/(1000*60*60*24); // 過ぎているほど優先
  else if(dueToday) score += 500;
  else if(rec.reviewCount > 0){
    const incorrectRate = rec.reviewCount ? rec.incorrectCount/rec.reviewCount : 0;
    score += incorrectRate * 200; // 不正解率が高いほど優先
    const daysSinceLearn = rec.lastReviewedAt ? (now - new Date(rec.lastReviewedAt))/(1000*60*60*24) : 999;
    if(daysSinceLearn < 1) score += 30; // 覚えたばかり = 低優先(後回し)寄りに調整
  } else {
    score += 10; // 未学習は最後
  }
  score += Math.random()*8; // ランダム性
  return score;
}
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

function pickModeForCard(card){
  const enabled = QUESTION_MODES.filter(m => SETTINGS.enabledModes[m.id] !== false).filter(m=>{
    // 記号/写真が未登録の場合はそのモードを除外
    if(m.qSide==='symbol' || m.aSide==='symbol') return !!card.symbolImage;
    if(m.qSide==='photo' || m.aSide==='photo') return !!card.photoImage;
    return true;
  });
  if(!enabled.length) return QUESTION_MODES[2]; // fallback: desc2name
  return enabled[Math.floor(Math.random()*enabled.length)];
}

function buildQueue(cardPool, count, fixedModeId){
  const sorted = [...cardPool].sort((a,b)=> priorityScore(b) - priorityScore(a));
  const chosen = count === Infinity ? sorted : sorted.slice(0, count);
  return chosen.map(card => ({
    card,
    mode: fixedModeId ? modeById(fixedModeId) : pickModeForCard(card)
  }));
}

function h(tag, attrs={}, children=[]){
  const el = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k === 'class') el.className = v;
    else if(k === 'html') el.innerHTML = v;
    else if(k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if(v !== null && v !== undefined) el.setAttribute(k, v);
  }
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c === null || c === undefined) return;
    if(typeof c === 'string') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  });
  return el;
}

/* ---------- Gauge SVG (mastery ring, "電流計" motif) ---------- */
function gaugeSVG(pct){
  const r = 38, c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 88 88'); svg.setAttribute('class','gauge');
  svg.innerHTML = `
    <circle cx="44" cy="44" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
    <circle cx="44" cy="44" r="${r}" fill="none" stroke="#C8722A" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 44 44)"/>
    <text x="44" y="49" text-anchor="middle" font-family="JetBrains Mono" font-size="17" font-weight="700" fill="#E9EDF4">${pct}%</text>
  `;
  return svg;
}

  const buckets = {new:0, learning:0, mastered:0, due:0};

    const cls = ReviewScheduler.classify(rec);
    if(cls === 'due') buckets.due++;
    else buckets[cls] = (buckets[cls]||0)+1;
  });
  return buckets;
}

function handleCSVFileSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{ await doImportText(reader.result); };
  reader.readAsText(file, 'UTF-8');
}
async function doImportText(text){
  if(!text || !text.trim()){ showToast('CSVが空です'); return; }
  const result = await importCSVText(text, logImport);
  PENDING_IMAGES = PENDING_IMAGES.concat(result.pendingImages||[]);
  render();
}
async function handleBulkImageSelect(e){
  const files = Array.from(e.target.files||[]);
  if(!files.length) return;
  let matched = 0, unmatched = 0;
  for(const file of files){
    const idx = PENDING_IMAGES.findIndex(p => p.filename === file.name);
    if(idx === -1){
      // ファイル名がカードIDそのものと一致するケースも許容 (id.jpg 等)
      const base = file.name.replace(/\.[^.]+$/,'');
      const cardMatch = CARDS.find(c=>c.id===base);
      if(cardMatch){
        try{
          const dataUrl = await processImageFile(file, 'photo');
          await setImage(cardMatch.id, 'photo', dataUrl);
          cardMatch.photoImage = true;
          matched++;
          logImport(`${file.name} → ${cardMatch.name} (写真) に登録`, 'ok');
          continue;
        }catch(err){ unmatched++; continue; }
      }
      unmatched++;
      continue;
    }
    const pending = PENDING_IMAGES[idx];
    const card = CARDS.find(c=>c.id===pending.cardId);
    if(!card){ unmatched++; continue; }
    try{
      const dataUrl = await processImageFile(file, pending.kind);
      await setImage(card.id, pending.kind, dataUrl);
      card[pending.kind+'Image'] = true;
      matched++;
      logImport(`${file.name} → ${card.name} (${pending.kind==='symbol'?'配線図記号':'写真'}) に登録`, 'ok');
      PENDING_IMAGES.splice(idx,1);
    }catch(err){
      unmatched++;
      logImport(`${file.name} の処理に失敗しました`, 'err');
    }
  }
  await saveCards();
  logImport(`画像アップロード完了: 一致 ${matched}件 / 未一致 ${unmatched}件`, matched?'ok':'warn');
  render();
}

/* =========================================================================
   SCREEN: STUDY SESSION
   ========================================================================= */
let SESSION = null; // { queue:[{card,mode}], idx, results:[], revealed:bool }

function startSession(kind, fixedModeId, category, limit){
  let pool = CARDS;
  if(kind === 'category' && category) pool = CARDS.filter(c=>c.category===category);
  if(kind === 'weak') pool = CARDS.filter(c=>{
    const rec = LEARNING[c.id];
    return rec && rec.reviewCount>=2 && (rec.incorrectCount/rec.reviewCount)>=0.34;
  });
  if(kind === 'unlearned') pool = CARDS.filter(c=> !LEARNING[c.id] || LEARNING[c.id].reviewCount===0);
  if(kind === 'todayReview') pool = CARDS.filter(c=> ReviewScheduler.classify(LEARNING[c.id])==='due');

  if(!pool.length){ showToast('対象のカードがありません'); return; }

  let count;
  if(limit) count = limit;
  else if(kind === 'todayReview') count = Infinity;
  else count = SETTINGS.questionCount || 10;

  const queue = buildQueue(pool, count, kind==='single' ? fixedModeId : null);
  if(!queue.length){ showToast('出題可能なカードがありません(画像未登録の可能性)'); return; }

  SESSION = { queue, idx:0, results:[], revealed:false, kind };
  nav('study');
}

function currentQA(){
  const item = SESSION.queue[SESSION.idx];
  const {card, mode} = item;
  return {card, mode};
}
function sideContent(card, side){
  if(side === 'name') return {type:'text', value:card.name};
  if(side === 'desc') return {type:'text', value:card.description || '(役割の記載なし)'};
  if(side === 'symbol') return {type:'image', kind:'symbol'};
  if(side === 'photo') return {type:'image', kind:'photo'};
}

function screenStudy(){
  const root = h('div',{});
  if(!SESSION){ nav('home', {}, true); return h('div'); }
  root.appendChild(topbar('学習中', `${SESSION.idx+1} / ${SESSION.queue.length}`, true));
  const s = h('div',{class:'screen'});

  const progress = h('div',{class:'study-progress'},[
    h('div',{class:'progress-track'},[h('div',{class:'progress-fill', style:`width:${(SESSION.idx/SESSION.queue.length*100)}%`})]),
    h('div',{class:'study-count'}, `${SESSION.idx+1}/${SESSION.queue.length}`)
  ]);
  s.appendChild(progress);

  const {card, mode} = currentQA();
  const stage = h('div',{class:'card-stage'});
  const fc = h('div',{class:'flashcard', id:'flashcard'});
  fc.appendChild(h('div',{class:'fc-tick tl'}));
  fc.appendChild(h('div',{class:'fc-tick tr'}));
  fc.appendChild(h('div',{class:'fc-tick bl'}));
  fc.appendChild(h('div',{class:'fc-tick br'}));
  fc.appendChild(h('div',{class:'fc-eyebrow'}, mode.label));
  fc.appendChild(h('div',{class:'fc-question'}, mode.qLabel));

  const qContent = sideContent(card, mode.qSide);
  const media = h('div',{class:'fc-media'+(qContent.type==='image'?' '+qContent.kind:'')});
  if(qContent.type==='text'){
    media.appendChild(h('div',{class:'desc-text'}, qContent.value));
  } else {
    const img = h('img',{alt:''});
    media.appendChild(img);
    getImage(card.id, qContent.kind).then(src=>{ if(src) img.src = src; else media.innerHTML='<div class="desc-text" style="opacity:.4;font-size:13px;">(画像未登録)</div>'; });
  }
  fc.appendChild(media);

  const answerWrap = h('div',{id:'answer-wrap'});
  fc.appendChild(answerWrap);
  if(!SESSION.revealed){
    fc.appendChild(h('div',{class:'fc-hint'}, 'タップして答えを見る'));
  }

  const flashOverlay = h('div',{class:'swipe-flash', id:'swipe-flash'});
  fc.appendChild(flashOverlay);

  if(SESSION.revealed) renderAnswer(answerWrap, card, mode);

  fc.addEventListener('click', (e)=>{
    if(SESSION._dragging) return;
    if(!SESSION.revealed){
      SESSION.revealed = true;
      renderAnswer(answerWrap, card, mode);
      const hint = fc.querySelector('.fc-hint'); if(hint) hint.remove();
    }
  });

  stage.appendChild(fc);
  s.appendChild(stage);

  const judgeRow = h('div',{class:'judge-row'});
  const wrongBtn = h('button',{class:'judge-btn incorrect', onclick:()=>judge(false)},[
    h('div',{class:'arrow-ico'},'←'), h('div',{class:'txt'},'不正解')
  ]);
  const rightBtn = h('button',{class:'judge-btn correct', onclick:()=>judge(true)},[
    h('div',{class:'arrow-ico'},'→'), h('div',{class:'txt'},'正解')
  ]);
  if(!SESSION.revealed){ wrongBtn.style.opacity='0.35'; rightBtn.style.opacity='0.35'; wrongBtn.style.pointerEvents='none'; rightBtn.style.pointerEvents='none'; }
  judgeRow.appendChild(wrongBtn); judgeRow.appendChild(rightBtn);
  s.appendChild(judgeRow);

  root.appendChild(s);
  setTimeout(()=> attachSwipe(document.getElementById('flashcard')), 0);
  return root;
}
function renderAnswer(wrap, card, mode){
  wrap.innerHTML = '';
  wrap.appendChild(h('div',{class:'fc-divider'}));
  const box = h('div',{class:'fc-answer'});
  box.appendChild(h('div',{class:'a-label'}, '答え'));
  const aContent = sideContent(card, mode.aSide);
  if(aContent.type==='text'){
    box.appendChild(h('div',{class: mode.aSide==='name' ? 'a-name' : 'a-desc', style: mode.aSide==='desc' ? 'font-size:15px;margin-top:4px;' : ''}, aContent.value));
  } else {
    const mwrap = h('div',{class:'a-media'});
    const img = h('img',{alt:''});
    mwrap.appendChild(img);
    getImage(card.id, aContent.kind).then(src=>{ if(src) img.src = src; });
    box.appendChild(mwrap);
    box.appendChild(h('div',{class:'a-name', style:'font-size:17px;margin-top:8px;'}, card.name));
  }
  if(mode.aSide !== 'desc' && card.description){
    box.appendChild(h('div',{class:'a-desc'}, '役割: ' + card.description));
  }
  wrap.appendChild(box);
}

function attachSwipe(fc){
  if(!fc) return;
  let startX=0, startY=0, dx=0, dragging=false, decided=false;
  const flash = fc.querySelector('#swipe-flash');
  function reset(){
    fc.style.transition = 'transform .25s ease';
    fc.style.transform = '';
    if(flash){ flash.style.opacity = 0; flash.className='swipe-flash'; }
    setTimeout(()=>{ fc.style.transition=''; }, 250);
  }
  function onDown(x,y){
    if(!SESSION.revealed) return;
    dragging = true; decided=false; startX=x; startY=y; SESSION._dragging=false;
  }
  function onMove(x,y){
    if(!dragging) return;
    dx = x-startX;
    if(Math.abs(dx) > 8) SESSION._dragging = true;
    const rot = dx/18;
    fc.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    if(flash){
      const p = Math.min(Math.abs(dx)/110, 1);
      flash.style.opacity = p*0.9;
      flash.className = 'swipe-flash ' + (dx>0?'correct':'incorrect');
    }
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    if(Math.abs(dx) > 90){
      const isCorrect = dx>0;
      fc.style.transition='transform .3s ease'; fc.style.transform=`translateX(${isCorrect?600:-600}px) rotate(${dx/10}deg)`;
      setTimeout(()=>judge(isCorrect), 180);
    } else {
      reset();
    }
    dx = 0;
    setTimeout(()=>{ SESSION._dragging=false; }, 50);
  }
  fc.addEventListener('touchstart', e=>{ const t=e.touches[0]; onDown(t.clientX,t.clientY); }, {passive:true});
  fc.addEventListener('touchmove', e=>{ const t=e.touches[0]; onMove(t.clientX,t.clientY); }, {passive:true});
  fc.addEventListener('touchend', onUp);
  fc.addEventListener('mousedown', e=>onDown(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>{ if(dragging) onMove(e.clientX,e.clientY); });
  window.addEventListener('mouseup', onUp);
}

async function judge(isCorrect){
  if(!SESSION || !SESSION.revealed) return;
  const {card, mode} = currentQA();
  const rec = getLearning(card.id);
  ReviewScheduler.applyResult(rec, isCorrect, mode.id);
  await saveLearning();
  SESSION.results.push({cardId:card.id, mode:mode.id, correct:isCorrect});
  SESSION.idx++;
  SESSION.revealed = false;
  if(SESSION.idx >= SESSION.queue.length){
    nav('result', {}, true);
  } else {
    render();
  }
}

/* =========================================================================
   SCREEN: RESULT
   ========================================================================= */
function screenResult(){
  const root = h('div',{});
  root.appendChild(topbar('学習結果', null, false));
  const s = h('div',{class:'screen'});
  if(!SESSION){ nav('home',{},true); return h('div'); }
  const total = SESSION.results.length;
  const correct = SESSION.results.filter(r=>r.correct).length;
  const incorrect = total-correct;
  const pct = total ? Math.round(correct/total*100) : 0;

  s.appendChild(h('div',{class:'result-hero'},[
    h('div',{class:'pct'}, pct+'%'),
    h('div',{class:'lbl'}, `${total}問中 ${correct}問正解`),
    h('div',{class:'result-stats'},[
      h('div',{class:'result-stat ok'},[h('div',{class:'n'},String(correct)),h('div',{class:'l'},'正解')]),
      h('div',{class:'result-stat ng'},[h('div',{class:'n'},String(incorrect)),h('div',{class:'l'},'不正解')]),
    ])
  ]));

  const dueNext = SESSION.results.filter(r=>!r.correct).length;
  s.appendChild(h('div',{class:'panel'}, `今回の復習対象: ${dueNext}枚 (近いうちに再出題されます)`));

  s.appendChild(h('button',{class:'cta', onclick:()=>{SESSION=null; nav('home',{},true);}}, 'ホームに戻る'));
  const row = h('div',{class:'btn-row'});
  row.appendChild(h('button',{class:'btn', onclick:()=>nav('weak',{},true)}, '苦手カードを見る'));
  row.appendChild(h('button',{class:'btn', onclick:()=>nav('modes',{},true)}, 'もう一度学習'));
  s.appendChild(row);

  root.appendChild(s);
  return root;
}

/* =========================================================================
   SCREEN: HISTORY
   ========================================================================= */
function screenHistory(){
  const root = h('div',{});
  root.appendChild(topbar('学習履歴', `全${CARDS.length}枚`));
  const s = h('div',{class:'screen'});

  let totalReview=0, totalCorrect=0, totalIncorrect=0;
  Object.values(LEARNING).forEach(r=>{ totalReview+=r.reviewCount; totalCorrect+=r.correctCount; totalIncorrect+=r.incorrectCount; });
  const overallPct = totalReview ? Math.round(totalCorrect/totalReview*100) : 0;

  s.appendChild(h('div',{class:'panel'},[
    h('div',{class:'section-label'},'累計'),
    h('div',{class:'kv-row'},[h('span',{class:'k'},'総復習回数'), h('span',{class:'v'}, totalReview+'回')]),
    h('div',{class:'kv-row'},[h('span',{class:'k'},'正解'), h('span',{class:'v'}, totalCorrect+'回')]),
    h('div',{class:'kv-row'},[h('span',{class:'k'},'不正解'), h('span',{class:'v'}, totalIncorrect+'回')]),
    h('div',{class:'kv-row'},[h('span',{class:'k'},'全体正解率'), h('span',{class:'v'}, overallPct+'%')]),
  ]));

  const buckets = classifyAll();
  s.appendChild(h('div',{class:'panel'},[
    h('div',{class:'section-label'},'内訳'),
    h('div',{class:'kv-row'},[h('span',{class:'k'},'未学習'), h('span',{class:'v'}, (buckets.new||0)+'枚')]),
    h('div',{class:'kv-row'},[h('span',{class:'k'},'学習中'), h('span',{class:'v'}, (buckets.learning||0)+'枚')]),
    h('div',{class:'kv-row'},[h('span',{class:'k'},'習得済み'), h('span',{class:'v'}, (buckets.mastered||0)+'枚')]),
    h('div',{class:'kv-row'},[h('span',{class:'k'},'要復習'), h('span',{class:'v'}, (buckets.due||0)+'枚')]),
  ]));

  // 最近復習したカード
  const recentCards = CARDS
    .filter(c=>LEARNING[c.id] && LEARNING[c.id].lastReviewedAt)
    .sort((a,b)=> new Date(LEARNING[b.id].lastReviewedAt) - new Date(LEARNING[a.id].lastReviewedAt))
    .slice(0,15);
  s.appendChild(h('div',{class:'section-label'},'最近学習したカード'));
  const list = h('div',{class:'mode-list'});
  recentCards.forEach(c=> list.appendChild(cardListItem(c)));
  if(!recentCards.length) list.appendChild(h('div',{class:'empty-state'},'まだ学習履歴がありません'));
  s.appendChild(list);

  s.appendChild(bottomNav('history'));
  root.appendChild(s);
  return root;
}

/* =========================================================================
   SCREEN: SETTINGS
   ========================================================================= */
function screenSettings(){
  const root = h('div',{});
  root.appendChild(topbar('設定'));
  const s = h('div',{class:'screen'});

  s.appendChild(h('div',{class:'section-label'},'出題設定'));
  const countPanel = h('div',{class:'panel'});
  countPanel.appendChild(h('div',{style:'font-size:13px;margin-bottom:10px;'}, '1回の出題数(デフォルト)'));
  const chipRow = h('div',{class:'chip-row'});
  [5,10,20,30].forEach(n=>{
    chipRow.appendChild(h('button',{class:'chip'+(SETTINGS.questionCount===n?' active':''), onclick:async()=>{ SETTINGS.questionCount=n; await saveSettings(); render(); }}, String(n)+'問'));
  });
  countPanel.appendChild(chipRow);
  s.appendChild(countPanel);

  s.appendChild(h('div',{class:'section-label'},'有効な出題方向'));
  const modePanel = h('div',{class:'panel mode-list'});
  QUESTION_MODES.forEach(m=>{
    const enabled = SETTINGS.enabledModes[m.id] !== false;
    modePanel.appendChild(h('div',{class:'mode-item', onclick:async()=>{
      SETTINGS.enabledModes[m.id] = !enabled; await saveSettings(); render();
    }}, [
      h('div',{class:'name'}, m.label),
      h('div',{class:'arrow', style:`color:${enabled?'var(--teal)':'var(--ink-dim)'}`}, enabled?'ON':'OFF')
    ]));
  });
  s.appendChild(modePanel);

  s.appendChild(h('div',{class:'section-label'},'データ管理'));
  const dataPanel = h('div',{class:'btn-row'});
  dataPanel.appendChild(h('button',{class:'btn', onclick:exportBackup}, '⬆ バックアップ書き出し'));
  const importBtn = h('label',{class:'btn', style:'position:relative;'},[
    '⬇ バックアップ復元',
    h('input',{type:'file', accept:'.json', style:'position:absolute;inset:0;opacity:0;cursor:pointer;', onchange:importBackup})
  ]);
  dataPanel.appendChild(importBtn);
  s.appendChild(dataPanel);
  s.appendChild(h('button',{class:'btn', onclick:()=>nav('import')}, '📄 CSVインポート画面へ'));

  s.appendChild(h('div',{class:'section-label'},'アプリ情報'));
  s.appendChild(h('div',{class:'panel'},[
    h('div',{class:'kv-row'},[h('span',{class:'k'},'カード枚数'), h('span',{class:'v'}, CARDS.length+'枚')]),
    h('div',{class:'kv-row'},[h('span',{class:'k'},'バージョン'), h('span',{class:'v'}, '1.0.0')]),
  ]));

  s.appendChild(bottomNav('settings'));
  root.appendChild(s);
  return root;
}
async function exportBackup(){
  const images = {};
  const list = await store.list('img:', false).catch(()=>({keys:[]}));
  const keys = (list && list.keys) || [];
  for(const k of keys){
    const val = await storeGetText(k);
    if(val) images[k] = val;
  }
  const backup = { version:1, exportedAt:new Date().toISOString(), cards:CARDS, learning:LEARNING, settings:SETTINGS, images };
  const blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `electrician_flashcards_backup_${Date.now()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('バックアップを書き出しました');
}
async function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup.cards) throw new Error('invalid backup');
    CARDS = backup.cards || [];
    LEARNING = backup.learning || {};
    SETTINGS = Object.assign({...DEFAULT_SETTINGS}, backup.settings||{});
    await saveCards(); await saveLearning(); await saveSettings();
    if(backup.images){
      for(const [k,v] of Object.entries(backup.images)){
        await storeSetText(k, v);
      }
      IMAGE_CACHE = {};
    }
    showToast('バックアップを復元しました');
    render();
  }catch(err){
    console.error(err);
    showToast('復元に失敗しました。ファイルを確認してください');
  }
}

/* =========================================================================
   MAIN RENDER
   ========================================================================= */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  let node;
  switch(ROUTE.screen){
    case 'home': node = screenHome(); break;
    case 'modes': node = screenModes(); break;
    case 'categories': node = screenCategories(); break;
    case 'weak': node = screenWeak(); break;
    case 'unlearned': node = screenUnlearned(); break;
    case 'cardlist': node = screenCardList(); break;
    case 'addcard': node = screenAddCard(); break;
    case 'carddetail': node = screenCardDetail(ROUTE.params); break;
    case 'import': node = screenImport(); break;
    case 'study': node = screenStudy(); break;
    case 'result': node = screenResult(); break;
    case 'history': node = screenHistory(); break;
    case 'settings': node = screenSettings(); break;
    default: node = screenHome();
  }
  app.appendChild(node);
}

/* ---------------------------------------------------------------------
   BOOT
--------------------------------------------------------------------- */
(async function boot(){
  document.getElementById('app').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#9AA6B8;font-family:JetBrains Mono, monospace;font-size:13px;text-align:center;padding:0 30px;">初回起動処理中...<br>プリインストールカードを準備しています</div>';
  await loadAll();
  render();
})();
</script>
